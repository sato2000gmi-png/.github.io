.searchArea{

  align-items:center;

.nameSearch:focus{

.crossSearchLabel{

.sub{

.yearSelect{

.filterRow + .filterRow{

.sortControls{

.seasonTable th{

.titleBadge{

.hofBox{

  border-radius:8px;
  padding:9px;
  font-size:12px;
  line-height:1.6

.recordBox{

  border-radius:8px;
  padding:8px;
  font-size:11px;
  line-height:1.6;

  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  line-height:1.45;
  border:1px solid #ddd;
  border-radius:7px;
  padding:8px;

.loading{

  color:#777;

.errorBox{

.empty{

  .searchArea{

  }

  .nameSearch{
    width:100%;
    flex:none
  }

  .detailStatGrid{
    grid-template-columns:repeat(3,minmax(70px,1fr))
  }

  .detailRows{
    grid-template-columns:100px 1fr
  }
}
</style>

/* =========================================================
   共通ユーティリティ
   ========================================================= */

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function rankOf(v){
  v=Number(v)||0;
  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";
  return"G";
}

function overallOf(p){
  if(p.t==="B"){
    return(
      (Number(p.ab?.mt)||0)+
      (Number(p.ab?.pw)||0)+
      (Number(p.ab?.sp)||0)+
      (Number(p.ab?.am)||0)+
      (Number(p.ab?.fd)||0)
    )/5;
  }

  return(
    (Number(p.ap?.vl)||0)+
    (Number(p.ap?.ct)||0)+
    (Number(p.ap?.st)||0)+
    (Number(p.ap?.br)||0)
  )/4;
}

function pitchValue(p){
  return(
    (Number(p.ap?.vl)||0)*.30+
    (Number(p.ap?.ct)||0)*.30+
    (Number(p.ap?.st)||0)*.16+
    (Number(p.ap?.br)||0)*.24
  );
}

function positionClass(pos){
  if(pos==="P")return"pos-pitcher";
  if(pos==="C")return"pos-catcher";
  if(["1B","2B","3B","SS"].includes(pos))return"pos-infield";
  if(pos==="OF")return"pos-outfield";
  return"";
}

function abilityText(p){

}

function phaseOf(p){
  let peakS,peakE;

  if(p.gt==="early"){
    peakS=23;
    peakE=27;
  }else if(p.gt==="normal"){
    peakS=26;
    peakE=30;
  }else if(p.gt==="late"){
    peakS=29;
    peakE=33;
  }else{
    peakS=25;
    peakE=33;
  }

  if(Number(p.age)<peakS)return"成長期";
  if(Number(p.age)<=peakE)return"ピーク";
  return"衰退期";
}

function rankClass(v){

function barClass(v){

function statRows(p){

      ["走力",p.ab?.sp],

function peakText(p){
  if(!p.peak)return"不明";

  if(p.t==="B"){
    return`<span class="peakStats">
      <span class="peakStat"><b>ミート</b>${p.peak.mt}</span>

  }

  return`<span class="peakStats">

function peakGap(p){
  if(!p.peak)return 0;

  if(p.t==="B"){
    return(
      (Number(p.peak.mt)||0)-(Number(p.ab?.mt)||0)+
      (Number(p.peak.pw)||0)-(Number(p.ab?.pw)||0)+
      (Number(p.peak.sp)||0)-(Number(p.ab?.sp)||0)+
      (Number(p.peak.am)||0)-(Number(p.ab?.am)||0)+
      (Number(p.peak.fd)||0)-(Number(p.ab?.fd)||0)
    );
  }

  return(
    (Number(p.peak.vl)||0)-(Number(p.ap?.vl)||0)+
    (Number(p.peak.ct)||0)-(Number(p.ap?.ct)||0)+
    (Number(p.peak.st)||0)-(Number(p.ap?.st)||0)+
    (Number(p.peak.br)||0)-(Number(p.ap?.br)||0)
  );
}

function defenseText(p){
  if(p.t==="P"||!p.df)return"—";

  let a=[];

  for(let k in p.df){
    if(Number(p.df[k])>0){
      let lv=Number(p.df[k]);
      let mark=lv>=3?"◎":lv===2?"○":"△";
      a.push((POS_NAMES[k]||k)+mark);
    }
  }

  return a.length?a.join("、"):"—";
}

function roleText(p){
  if(p.t!=="P"||!p.rl)return"—";

  let a=[];

  if(Number(p.rl.sp)>0){
    a.push("先発"+(p.rl.sp>=3?"◎":p.rl.sp===2?"○":"△"));
  }

  if(Number(p.rl.rp)>0){
    a.push("中継ぎ"+(p.rl.rp>=3?"◎":p.rl.rp===2?"○":"△"));
  }

  if(Number(p.rl.cl)>0){
    a.push("抑え"+(p.rl.cl>=3?"◎":p.rl.cl===2?"○":"△"));
  }

  return a.length?a.join("、"):"—";
}

/* =========================================================
   成績計算
   ========================================================= */

function battingAverage(s){
  if(!s||!Number(s.AB))return null;
  return Number(s.H||0)/Number(s.AB);
}

function totalBases(s){
  if(!s)return 0;

  return(
    Number(s.H||0)+
    Number(s.D2||0)+
    Number(s.D3||0)*2+
    Number(s.HR||0)*3
  );
}

function approximateOBP(s){
  if(!s)return null;

  let ab=Number(s.AB||0);
  let bb=Number(s.BB||0);
  let h=Number(s.H||0);

  if(ab+bb<=0)return null;

  return(h+bb)/(ab+bb);
}

function slugging(s){
  if(!s||!Number(s.AB))return null;
  return totalBases(s)/Number(s.AB);
}

function ops(s){
  let obp=approximateOBP(s);
  let slg=slugging(s);

  if(obp===null||slg===null)return null;

  return obp+slg;
}

function era(s){
  if(!s||!Number(s.IPo))return null;
  return Number(s.ER||0)*27/Number(s.IPo);
}

function whip(s){
  if(!s||!Number(s.IPo))return null;
  return(Number(s.H||0)+Number(s.BB||0))*3/Number(s.IPo);
}

function inningsText(ipo){
  ipo=Number(ipo)||0;

  let whole=Math.floor(ipo/3);
  let rem=ipo%3;

  return rem
    ?`${whole}.${rem}`
    :`${whole}.0`;
}

function fmtAvg(v){
  return v===null?"—":v.toFixed(3).replace(/^0/,"");
}

function fmtEra(v){
  return v===null?"—":v.toFixed(2);
}

function fmtWhip(v){
  return v===null?"—":v.toFixed(3);
}

function seasonStats(p,year){
  year=String(year);

  if(Array.isArray(p.hist)){
    let h=p.hist.find(x=>String(x.y)===year);
    if(h&&h.s)return h.s;
  }

  /*
   * 現在年度だけ、histにまだ確定記録がない場合はcsを使用。
   */
  if(
    p.cs&&
    String(p.__year||currentYear)===year
  ){
    return p.cs;
  }

  return null;
}

function seasonSummary(p,year){
  let s=seasonStats(p,year);

  if(!s)return"成績データなし";

  if(p.t==="B"){
    let avg=battingAverage(s);
    let op=ops(s);

    return`${year}年　${s.G||0}試合　${fmtAvg(avg)}　${s.HR||0}本　${s.RBI||0}打点　${s.SB||0}盗塁　OPS ${op===null?"—":op.toFixed(3)}`;
  }

  let e=era(s);
  let w=Number(s.W||0);
  let l=Number(s.L||0);
  let gs=Number(s.GS||0);
  let hld=Number(s.HLD||0);
  let sv=Number(s.SV||0);
  let wh=whip(s);

  return`${year}年　${s.G||0}試合　${inningsText(s.IPo)}回　防御率 ${fmtEra(e)}　${w}勝${l}敗　${gs}先発　${hld}H　${sv}S　WHIP ${fmtWhip(wh)}`;
}

/* =========================================================
   フィルター
   ========================================================= */

function positionMatches(p){

  if(selectedPositions.has("ALL"))return true;

  for(let pos of selectedPositions){

    if(pos==="P"){
      if(p.t==="P")return true;
      continue;
    }

    if(p.t!=="B")continue;

    if(p.pos===pos)return true;

    if(
      includeSub&&
      p.df&&
      Number(p.df[pos]||0)>0
    ){
      return true;
    }
  }

  return false;
}

function roleMatches(p){

  if(p.t!=="P"){
    return selectedRoles.size===0;
  }

  if(selectedRoles.size===0)return true;
  if(!p.rl)return false;

  for(let role of selectedRoles){

    let lv=Number(p.rl[role]||0);

    if(excludeLowRole){
      if(lv>=2)return true;
    }else{
      if(lv>0)return true;
    }
  }

  return false;
}

function baseFilter(p){

  if(selectedLeague!=="ALL"){
    let team=TEAM_MAP[p.team];

    if(!team||team.lg!==selectedLeague){
      return false;
    }
  }

  if(
    selectedTeam!=="ALL"&&
    selectedTeam!=="MY"&&
    String(p.team)!==selectedTeam
  ){
    return false;
  }

  if(
    selectedTeam==="MY"&&
    String(p.team)!=="1"
  ){
    return false;
  }

  if(!positionMatches(p))return false;
  if(!roleMatches(p))return false;

  if(
    selectedPots.size>0&&
    !selectedPots.has(Number(p.pot))
  ){
    return false;
  }

  if(
    selectedGrowths.size>0&&
    !selectedGrowths.has(p.gt)
  ){
    return false;
  }

  return true;
}


/* =========================================================
   検索
   ========================================================= */

/*
 * 名前比較用。
 *
 * 「佐藤 太郎」
 * 「佐藤太郎」
 *
 * のどちらでも一致させる。
 */
function normalizeSearchText(v){
  return String(v||"")
    .toLocaleLowerCase("ja-JP")
    .replace(/[\s\u3000]+/g,"");
}

function searchTokens(){
  return String(searchName||"")
    .trim()
    .split(/[\s\u3000]+/)
    .filter(Boolean);
}

function tokenMatchesPlayer(p,token){

  let raw=String(token||"");
  let t=normalizeSearchText(raw);

  if(!t)return true;

  /*
   * No.検索
   *
   * 6
   * No.6
   * no6
   * p6
   * P6
   */
  let noToken=
    raw
      .toLowerCase()
      .replace(/^no[.\s]*/,"")
      .replace(/^p/,"");

  if(/^\d+$/.test(noToken)){

    let idNo=String(p.id||"").replace(/^p/i,"");

    if(idNo===noToken){
      return true;
    }
  }

  let name=normalizeSearchText(p.nm);

  return name.includes(t);
}

function nameMatches(p){

  if(!searchName)return true;

  let tokens=searchTokens();

  /*
   * スペース区切りはAND。
   *
   * 「佐藤 太郎」
   * → 名前に「佐藤」も「太郎」も含む。
   */
  return tokens.every(token=>tokenMatchesPlayer(p,token));
}


/* =========================================================
   検索結果
   ========================================================= */

function applyFilters(){

  if(crossYearSearch&&!searchName){
    return [];
  }

  let arr=[];

  if(!crossYearSearch){

    for(let p of players){

      if(!nameMatches(p))continue;
      if(!baseFilter(p))continue;

      arr.push(p);
    }

  }else{

    for(let y of availableYears){

      let list=yearData[y]||[];

      for(let p of list){

        if(!nameMatches(p))continue;
        if(!baseFilter(p))continue;

        arr.push(
          Object.assign({},p,{__year:y})
        );
      }
    }
  }

  arr.sort((a,b)=>{

    let x,y;

    if(sortMode==="overall"){
      x=overallOf(a);
      y=overallOf(b);

    }else if(sortMode==="pot"){
      x=a.pot;
      y=b.pot;

    }else if(sortMode==="age"){
      x=a.age;
      y=b.age;

    }else if(sortMode==="name"){

      let result=
        String(a.nm||"")
        .localeCompare(
          String(b.nm||""),
          "ja"
        );

      if(result!==0){
        return descending?-result:result;
      }

      return descending
        ?String(b.id||"").localeCompare(String(a.id||""))
        :String(a.id||"").localeCompare(String(b.id||""));

    }else{

      x=peakGap(a);
      y=peakGap(b);
    }

    if(x!==y){
      return descending?y-x:x-y;
    }

    return String(a.id||"")
      .localeCompare(String(b.id||""));
  });

  return arr;
}

/* =========================================================
   gzip JSON読み込み
   ========================================================= */

async function gunzipJSON(buffer){

  let ds=new DecompressionStream("gzip");

  let writer=ds.writable.getWriter();
  let reader=ds.readable.getReader();

  writer.write(new Uint8Array(buffer));
  writer.close();

  let chunks=[];
  let x;

  while(!(x=await reader.read()).done){
    chunks.push(x.value);
  }

  let total=chunks.reduce((n,a)=>n+a.length,0);
  let out=new Uint8Array(total);

  let off=0;

  for(let c of chunks){
    out.set(c,off);
    off+=c.length;
  }

  return JSON.parse(
    new TextDecoder().decode(out)
  );
}


/* =========================================================
   GitHub年度読み込み
   ========================================================= */

async function fetchGitHubYears(){

  let res=await fetch(
    GITHUB_API_BASE+"?ref=main&per_page=100",
    {cache:"no-store"}
  );

  if(!res.ok){
    throw new Error(
      "GitHub年度一覧取得失敗：HTTP "+res.status
    );
  }

  let files=await res.json();

  githubYears=
    files
      .filter(x=>
        x.type==="file"&&
        /^\d{4}\.json\.gz$/.test(x.name)
      )
      .map(x=>
        x.name.replace(/\.json\.gz$/,"")
      )
      .sort((a,b)=>Number(b)-Number(a));
}

async function fetchYearFromGitHub(year){

  year=String(year);

  if(githubLoadedYears.has(year)){
    return yearData[year]||[];
  }

  if(loadingPromises[year]){
    return loadingPromises[year];
  }

  loadingPromises[year]=(async()=>{

    let url=
      GITHUB_RAW_BASE+
      "/"+
      encodeURIComponent(year)+
      ".json.gz";

    let res=await fetch(
      url,
      {cache:"no-cache"}
    );

    if(!res.ok){
      throw new Error(
        `${year}年度データ取得失敗：HTTP ${res.status}`
      );
    }

    let data=
      await gunzipJSON(
        await res.arrayBuffer()
      );

    if(!Array.isArray(data.players)){
      throw new Error(
        `${year}年度データの形式が正しくありません`
      );
    }

    yearData[year]=data.players;
    githubLoadedYears.add(year);

    return yearData[year];

  })();

  try{
    return await loadingPromises[year];
  }finally{
    delete loadingPromises[year];
  }
}

async function ensureYearLoaded(year){

  year=String(year);

  if(githubYears.includes(year)){
    return await fetchYearFromGitHub(year);
  }

  if(
    Object.prototype.hasOwnProperty.call(
      yearData,
      year
    )
  ){
    return yearData[year];
  }

  throw new Error(
    `${year}年度のデータが見つかりません`
  );
}

async function ensureAllYearsLoaded(){

  await Promise.all(
    availableYears.map(
      year=>ensureYearLoaded(year)
    )
  );
}

/* =========================================================
   旧URLデータ
   ========================================================= */

async function decodeLegacyHash(){

  let hash=location.hash.slice(1);

  if(!hash)return null;

  hash=
    hash
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  while(hash.length%4){
    hash+="=";
  }

  let bin=atob(hash);
  let u=new Uint8Array(bin.length);

  for(let i=0;i<bin.length;i++){
    u[i]=bin.charCodeAt(i);
  }

  let ds=new DecompressionStream("deflate");
  let writer=ds.writable.getWriter();
  let reader=ds.readable.getReader();

  writer.write(u);
  writer.close();

  let chunks=[];
  let x;

  while(!(x=await reader.read()).done){
    chunks.push(x.value);
  }

  let total=chunks.reduce((n,a)=>n+a.length,0);
  let out=new Uint8Array(total);

  let off=0;

  for(let c of chunks){
    out.set(c,off);
    off+=c.length;
  }

  return JSON.parse(
    new TextDecoder().decode(out)
  );
}

function rebuildAvailableYears(){

  let set=new Set([
    ...githubYears,
    ...Object.keys(yearData)
  ]);

  availableYears=
    [...set]
      .sort((a,b)=>Number(b)-Number(a));
}

      </select>
     　在籍選手 ${players.length}人`;

  document
    .getElementById("yearFilter")
    .addEventListener(
      "change",
      e=>{
        selectYear(e.target.value);
      }
    );
}

async function selectYear(year){

  year=String(year);

  let previousPlayers=players;

  document.getElementById("yearText").textContent=
    `${year}年度　データを読み込んでいます…`;

  try{

    let list=
      await ensureYearLoaded(year);

    players=list;

    updateYearText(year);
    resetAndRender();

  }catch(e){

    console.error(e);

    players=previousPlayers;

    updateYearText(
      currentYear||availableYears[0]||year
    );

    alert(
      `${year}年度のデータを読み込めませんでした。\n\n`+
      e.message
    );
  }
}

function findLatestPlayer(id){

  let found=null;
  let foundYear=-Infinity;

  for(let y of availableYears){

    let list=yearData[y]||[];

    let p=list.find(x=>String(x.id)===String(id));

    if(p&&Number(y)>foundYear){
      found=Object.assign({},p,{__year:y});
      foundYear=Number(y);
    }
  }

  return found;
}

function findCareerPlayer(id){

  if(!careerData)return null;

  let hof=Array.isArray(careerData.hof)
    ?careerData.hof.find(x=>String(x.pid)===String(id))
    :null;

  if(hof){
    return{
      kind:"hof",
      data:hof
    };
  }

  let retired=
    careerData.retired&&
    careerData.retired[id];

  if(retired){
    return{
      kind:"retired",
      data:retired
    };
  }

  return null;
}

function latestOrCareer(id){

  let active=findLatestPlayer(id);

  /*
   * 現役選手が最新年度ファイルに存在する場合はこちらを優先。
   */
  if(active){
    return{
      kind:"active",
      data:active
    };
  }

  let career=findCareerPlayer(id);

  if(career)return career;

  return null;
}

function careerTotalsFor(p,careerEntry){

  if(careerEntry?.data?.totals){
    return careerEntry.data.totals;
  }

  if(Array.isArray(p.hist)&&p.hist.length){

    let keys=p.t==="B"
      ?["G","PA","AB","H","D2","D3","HR","RBI","R","SB","BB","SO"]
      :["G","GS","W","L","SV","HLD","IPo","H","HR","BB","SO","ER","CG"];

    let out={};

    for(let k of keys)out[k]=0;

    for(let h of p.hist){

      if(!h.s)continue;

      for(let k of keys){
        out[k]+=Number(h.s[k]||0);
      }
    }

    /*
     * 最新年度のhistに当年分がまだなく、
     * csが存在する場合は追加。
     */
    let lastYear=p.hist.length
      ?String(p.hist[p.hist.length-1].y)
      :null;

    if(
      p.cs&&
      String(p.__year||currentYear)!==lastYear
    ){
      for(let k of keys){
        out[k]+=Number(p.cs[k]||0);
      }
    }

    return out;
  }

  return null;
}

  let copy=Object.assign({},p);
  delete copy.__year;

  return`
    <textarea class="rawData" readonly>${esc(
      JSON.stringify(copy,null,2)
    )}</textarea>
  `;
}

/* =========================================================
   詳細ページ
   ========================================================= */

async function loadDetail(id){

  document.title="選手詳細";

  document.getElementById("app").innerHTML=
    `<div class="loading">
      選手データを読み込んでいます…
    </div>`;

  try{

    /*
     * 詳細ページは自動的に全年度横断。
     */
    await ensureAllYearsLoaded();

    /*
     * CAREERも自動読み込み。
     */
    try{
      await loadCareer();
    }catch(e){
      console.warn("CAREER読み込み失敗",e);
      careerData=null;
    }

    let entry=latestOrCareer(id);

    if(!entry){

      document.getElementById("app").innerHTML=
        `<div class="errorBox">
          選手ID「${esc(id)}」の選手が見つかりません。<br><br>
          <a href="./players.html">一覧へ戻る</a>
        </div>`;

      return;
    }

    document.getElementById("app").innerHTML=
      detailHTML(entry);

    document.title=
      `${entry.data.nm||"選手"} - 在籍選手データベース`;

  }catch(e){

    console.error(e);

    document.getElementById("app").innerHTML=
      `<div class="errorBox">
        データの読み込みに失敗しました。<br><br>
        ${esc(e.message)}<br><br>
        <a href="./players.html">一覧へ戻る</a>
      </div>`;
  }
}


/* =========================================================
   一覧初期ロード
   ========================================================= */

async function loadList(){

  document.getElementById("app").innerHTML=
    listHTML();

  setupList();

  /*
   * 旧URLのデータを読む。
   */
  let hash=location.hash.slice(1);

  if(hash){

    try{

      let data=
        await decodeLegacyHash();

      if(data.years){

        for(let y of Object.keys(data.years)){
          yearData[String(y)]=data.years[y];
        }

      }else if(data.players){

        let y=String(data.year||"?");
        yearData[y]=data.players;

      }else{

        throw new Error(
          "対応していない旧URLデータ形式です"
        );
      }

    }catch(e){

      console.error(
        "旧URLデータ読み込み失敗",
        e
      );
    }
  }


  /*
   * GitHub年度一覧。
   */
  let githubError=null;

  try{

    await fetchGitHubYears();

  }catch(e){

    console.error(e);
    githubError=e;
    githubYears=[];
  }


  rebuildAvailableYears();


  if(!availableYears.length){

    document.getElementById("yearText").textContent=
      githubError
        ?"GitHubから年度データを取得できませんでした。"
        :"保存されている年度データがありません。";

    document.getElementById("count").textContent=
      "データなし";

    return;
  }


  let firstYear=availableYears[0];

  try{

    let list=
      await ensureYearLoaded(firstYear);

    players=list;

    updateYearText(firstYear);
    render();

  }catch(e){

    console.error(e);

    if(
      Object.prototype.hasOwnProperty.call(
        yearData,
        firstYear
      )
    ){

      players=yearData[firstYear];

      updateYearText(firstYear);
      render();

    }else{

      document.getElementById("yearText").textContent=
        `${firstYear}年度データの読み込みに失敗しました。`;

      document.getElementById("count").textContent=
        e.message;
    }
  }
}


/* =========================================================
   起動
   ========================================================= */

(async()=>{

  let params=
    new URLSearchParams(
      location.search
    );

  let id=params.get("id");

  if(id){

    /*
     * players.html?id=p6
     */
    await loadDetail(id);

  }else{

    /*
     * 通常の一覧。
     */
    await loadList();
  }

})();
</script>
