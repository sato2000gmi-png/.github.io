<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在籍選手データベース</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}

.container{
  max-width:1500px;
  margin:0 auto;
  padding:18px;
}

h1{
  margin:0 0 16px;
  font-size:24px;
  letter-spacing:.02em;
}

.controls{
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.controlRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:9px;
}

.controlRow:last-child{
  margin-bottom:0;
}

label{
  font-size:13px;
  font-weight:700;
  color:#555;
}

select,
input{
  border:1px solid #cfd5dc;
  border-radius:7px;
  padding:7px 9px;
  background:#fff;
  font-size:13px;
}

button{
  border:1px solid #cfd5dc;
  background:#fff;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font-size:13px;
}

button:hover{
  background:#f0f2f5;
}

button.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.positionButtons{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.positionButtons button{
  min-width:42px;
}

.positionButtons button.active{
  background:#333;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.card{
  position:relative;
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.045);
}

.teamLine{
  height:5px;
  background:var(--team-color,#999);
}

.cardBody{
  padding:13px 14px 14px;
}

.cardHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:8px;
}

.team{
  color:var(--team-color,#666);
  font-size:12px;
  font-weight:800;
  margin-bottom:2px;
}

.name{
  font-size:19px;
  font-weight:800;
  line-height:1.25;
}

.basic{
  margin-top:5px;
  font-size:12px;
  color:#666;
  line-height:1.6;
}

.pos{
  font-weight:800;
}

.pos-pitcher{
  color:#dc2626;
}

.pos-catcher{
  color:#2563eb;
}

.pos-infield{
  color:#d49a00;
}

.pos-outfield{
  color:#2e8b57;
}

.summary{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px 0 10px;
  border-bottom:1px solid #edf0f2;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:3px 8px;
  font-size:12px;
  font-weight:700;
  background:#f1f3f5;
}

.rankBadge{
  color:#fff;
  min-width:27px;
  justify-content:center;
}

.statTitle{
  font-size:13px;
  font-weight:800;
  margin:11px 0 7px;
}

.stat{
  display:grid;
  grid-template-columns:42px 22px minmax(70px,1fr) 27px;
  gap:7px;
  align-items:center;
  margin:6px 0;
  font-size:12px;
}

.statName{
  color:#555;
}

.stat .rank{
  font-weight:900;
  text-align:center;
}

.bar{
  height:8px;
  background:#edf0f2;
  border-radius:99px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  background:#999;
}

.statValue{
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.info{
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid #edf0f2;
  font-size:12px;
  line-height:1.8;
  color:#555;
}

.info b{
  color:#333;
}

.peakBox{
  display:flex;
  flex-wrap:wrap;
  gap:5px 10px;
  margin-top:3px;
}

.peakStat{
  white-space:nowrap;
}

.peakStat b{
  margin-right:3px;
}

.abilityList{
  display:flex;
  flex-wrap:wrap;
  gap:4px 8px;
}

.ab{
  font-weight:700;
}

.ab.good{
  color:#dc2626;
}

.ab.bad{
  color:#2563eb;
}

.noAbility{
  color:#888;
}

.defenseList{
  display:flex;
  flex-wrap:wrap;
  gap:4px 8px;
}

.defenseItem{
  white-space:nowrap;
}

.defenseMain{
  font-weight:800;
}

.roleList{
  display:flex;
  flex-wrap:wrap;
  gap:4px 8px;
}

.count{
  margin:8px 0 12px;
  font-size:13px;
  color:#666;
}

.empty{
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:12px;
  padding:30px;
  text-align:center;
  color:#777;
}

@media(max-width:1100px){
  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:700px){
  .container{
    padding:10px;
  }

  h1{
    font-size:21px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .controlRow{
    align-items:flex-start;
  }
}

:root{
  --s:#ff5fa2;
  --a:#f43f5e;
  --b:#fb923c;
  --c:#facc15;
  --d:#a3e635;
  --e:#38bdf8;
  --f:#94a3b8;
  --g:#7d8aa5;
}
</style>
</head>

<body>

<div class="container">
  <h1>在籍選手データベース</h1>

  <div class="controls">

    <div class="controlRow">
      <label>リーグ</label>
      <select id="league">
        <option value="">すべて</option>
        <option value="C">セ・リーグ</option>
        <option value="P">パ・リーグ</option>
      </select>

      <label>球団</label>
      <select id="team">
        <option value="">すべて</option>
      </select>

      <label>タイプ</label>
      <select id="type">
        <option value="">すべて</option>
        <option value="B">野手</option>
        <option value="P">投手</option>
      </select>

      <label>並び順</label>
      <select id="sort">
        <option value="overall">総合</option>
        <option value="age">年齢</option>
        <option value="pot">潜在能力</option>
        <option value="gap">伸びしろ</option>
        <option value="name">名前</option>
      </select>

      <select id="order">
        <option value="desc">降順</option>
        <option value="asc">昇順</option>
      </select>
    </div>

    <div class="controlRow">
      <label>総合</label>
      <select id="overallFilter">
        <option value="">すべて</option>
        <option value="S">S以上</option>
        <option value="A">A以上</option>
        <option value="B">B以上</option>
        <option value="C">C以上</option>
        <option value="D">D以上</option>
      </select>

      <label>年齢</label>
      <select id="ageFilter">
        <option value="">すべて</option>
        <option value="18">18歳</option>
        <option value="20">20歳以下</option>
        <option value="22">22歳以下</option>
        <option value="25">25歳以下</option>
        <option value="30">30歳以下</option>
        <option value="31">31歳以上</option>
      </select>

      <label>潜在能力</label>
      <select id="potFilter">
        <option value="">すべて</option>
        <option value="5">S</option>
        <option value="4">A以上</option>
        <option value="3">B以上</option>
        <option value="2">C以上</option>
        <option value="1">D以上</option>
      </select>

      <label>伸びしろ</label>
      <select id="gapFilter">
        <option value="">すべて</option>
        <option value="20">20以上</option>
        <option value="15">15以上</option>
        <option value="10">10以上</option>
        <option value="5">5以上</option>
      </select>
    </div>

    <div class="controlRow">
      <label>守備位置</label>
      <div class="positionButtons">
        <button data-pos="C">捕手</button>
        <button data-pos="1B">一塁</button>
        <button data-pos="2B">二塁</button>
        <button data-pos="3B">三塁</button>
        <button data-pos="SS">遊撃</button>
        <button data-pos="OF">外野</button>
      </div>

      <button id="subPosition">サブ守備も含める</button>
    </div>

    <div class="controlRow">
      <label>投手起用</label>
      <div class="positionButtons">
        <button data-role="sp">先発</button>
        <button data-role="rp">中継ぎ</button>
        <button data-role="cl">抑え</button>
      </div>
    </div>

  </div>

  <div class="count" id="count"></div>
  <div class="cards" id="cards"></div>
</div>

<script>
"use strict";

/* ============================================================
 * データ読み込み
 * ============================================================ */

let DATA = null;
let PLAYERS = [];

const RANK_COLOR = {
  S:"#ff5fa2",
  A:"#f43f5e",
  B:"#fb923c",
  C:"#facc15",
  D:"#a3e635",
  E:"#38bdf8",
  F:"#94a3b8",
  G:"#7d8aa5"
};

const POT_NAME = {
  5:"S",
  4:"A",
  3:"B",
  2:"C",
  1:"D"
};

const POS_NAME = {
  P:"投手",
  C:"捕手",
  "1B":"一塁",
  "2B":"二塁",
  "3B":"三塁",
  SS:"遊撃",
  OF:"外野"
};

const TEAM_MAP = {
  0:{nm:"東京クラウンズ",sh:"東京",ab:"TKC",lg:"C",col:"#d4a017"},
  1:{nm:"横浜DeNAベイスターズ",sh:"横浜",ab:"YKS",lg:"C",col:"#1d6fd6"},
  2:{nm:"名古屋シャークズ",sh:"名古屋",ab:"NGS",lg:"C",col:"#0e9aa7"},
  3:{nm:"京都ウルブズ",sh:"京都",ab:"KYW",lg:"C",col:"#7c3aed"},
  4:{nm:"大阪サンダーズ",sh:"大阪",ab:"OST",lg:"C",col:"#e8500a"},
  5:{nm:"広島フェニックス",sh:"広島",ab:"HRP",lg:"C",col:"#dc2626"},
  6:{nm:"札幌ベアーズ",sh:"札幌",ab:"SPB",lg:"P",col:"#92400e"},
  7:{nm:"仙台フロンティアーズ",sh:"仙台",ab:"SDF",lg:"P",col:"#b91c1c"},
  8:{nm:"埼玉ファルコンズ",sh:"埼玉",ab:"STF",lg:"P",col:"#1e3a8a"},
  9:{nm:"千葉オーシャンズ",sh:"千葉",ab:"CBO",lg:"P",col:"#0284c7"},
  10:{nm:"神戸ブレイカーズ",sh:"神戸",ab:"KBB",lg:"P",col:"#059669"},
  11:{nm:"福岡ブレイズ",sh:"福岡",ab:"FKB",lg:"P",col:"#ea580c"}
};

const GOOD_ABILITIES = new Set([
  "avgHit","powHit","wideAng","chance3","chance2","vsLeftB3","vsAce",
  "katame","shokyu","nebari","manrui","sayonara","gyakkyo","kaimaku",
  "natsu","aki","daida","bunt","shobu","steal3","baserun3","headsl",
  "fldArt","laser","throw3","lead3","block3","nobi","kire","omoi",
  "vsPinch","vsLeftP3","tough","quick","kensei","kSama","kanto",
  "tetsuwan","hikeshi","shiriagari","kachiun","ironBody","recover",
  "mood","ninki","toushi","vetAji","bigstage","omatsuri","gapHit",
  "vsRightB3","soku","badball","leadoff","gekitetsu","groundball",
  "noWalk","lateStopper","vsRightP3","lucky","cleanup","lowerStar",
  "second"
]);

const BAD_ABILITIES = new Set([
  "sanshin","heisatsu","chanceX","vsLeftBX","murake","slowB","stealX",
  "throwX","errorPr","ippatsu","yonkyu","slowP","makeun","tanki",
  "fragGlass","glassBody","tofu"
]);

/*
 * 能力名。
 * 元ページの ABILITY_MAP が存在しないため、
 * 保存データのIDを表示できるようID→日本語名を用意。
 */
const ABILITY_NAME = {
  avgHit:"アベレージヒッター",
  powHit:"パワーヒッター",
  wideAng:"広角打法",
  chance3:"チャンス◎",
  chance2:"チャンス○",
  vsLeftB3:"対左投手◎",
  vsAce:"対エース○",
  katame:"固め打ち",
  shokyu:"初球○",
  nebari:"粘り打ち",
  manrui:"満塁男",
  sayonara:"サヨナラ男",
  gyakkyo:"逆境○",
  kaimaku:"開幕○",
  natsu:"夏男",
  aki:"秋男",
  daida:"代打○",
  bunt:"バント○",
  shobu:"勝負師",
  steal3:"盗塁◎",
  baserun3:"走塁◎",
  headsl:"ヘッドスライディング",
  fldArt:"守備職人",
  laser:"レーザービーム",
  throw3:"送球◎",
  lead3:"キャッチャー◎",
  block3:"ブロック○",
  nobi:"ノビ○",
  kire:"キレ○",
  omoi:"重い球",
  vsPinch:"対ピンチ○",
  vsLeftP3:"対左打者◎",
  tough:"打たれ強さ○",
  quick:"クイック○",
  kensei:"牽制○",
  kSama:"キレッキレ",
  kanto:"コントロール○",
  tetsuwan:"鉄腕",
  hikeshi:"火消し",
  shiriagari:"尻上がり",
  kachiun:"勝ち運",
  ironBody:"鉄人",
  recover:"回復○",
  mood:"ムード○",
  ninki:"人気者",
  toushi:"闘志",
  vetAji:"ベテランの味",
  bigstage:"大舞台○",
  omatsuri:"お祭り男",
  gapHit:"ギャップヒッター",
  vsRightB3:"対右投手◎",
  soku:"速球中心",
  badball:"悪球打ち",
  leadoff:"切り込み隊長",
  gekitetsu:"激鉄",
  groundball:"ゴロピッチャー",
  noWalk:"四球を出さない",
  lateStopper:"終盤の火消し",
  vsRightP3:"対右打者◎",
  lucky:"ラッキーボーイ",
  cleanup:"4番○",
  lowerStar:"下位打線○",
  second:"二番○",

  sanshin:"三振",
  heisatsu:"併殺",
  chanceX:"チャンス×",
  vsLeftBX:"対左投手×",
  murake:"ムラっ気",
  slowB:"走塁×",
  stealX:"盗塁×",
  throwX:"送球×",
  errorPr:"エラー",
  ippatsu:"一発",
  yonkyu:"四球",
  slowP:"スロースターター",
  makeun:"負け運",
  tanki:"短気",
  fragGlass:"壊れやすい",
  glassBody:"ガラスの身体",
  tofu:"豆腐メンタル"
};

function rankOf(v){
  v=Number(v)||0;
  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";
  return"G";
}

function rankColor(v){
  return RANK_COLOR[rankOf(v)] || "#999";
}

function overallOf(p){
  if(p.t==="B"){
    const a=p.ab||{};
    return (
      Number(a.mt||0)+
      Number(a.pw||0)+
      Number(a.sp||0)+
      Number(a.am||0)+
      Number(a.fd||0)
    )/5;
  }

  const a=p.ap||{};
  return (
    Number(a.vl||0)+
    Number(a.ct||0)+
    Number(a.st||0)+
    Number(a.br||0)
  )/4;
}

function pitchValue(p){
  const a=p.ap||{};
  return (
    Number(a.vl||0)*0.30+
    Number(a.ct||0)*0.30+
    Number(a.st||0)*0.16+
    Number(a.br||0)*0.24
  );
}

function peakAverage(p){
  if(!p.peak)return 0;

  if(p.t==="B"){
    const a=p.peak;
    return (
      Number(a.mt||0)+
      Number(a.pw||0)+
      Number(a.sp||0)+
      Number(a.am||0)+
      Number(a.fd||0)
    )/5;
  }

  const a=p.peak;
  return (
    Number(a.vl||0)+
    Number(a.ct||0)+
    Number(a.st||0)+
    Number(a.br||0)
  )/4;
}

function peakGap(p){
  return Math.max(0,peakAverage(p)-overallOf(p));
}

/* ============================================================
 * 表示用
 * ============================================================ */

function positionClass(pos){
  if(pos==="P")return"pos-pitcher";
  if(pos==="C")return"pos-catcher";
  if(["1B","2B","3B","SS"].includes(pos))return"pos-infield";
  if(pos==="OF")return"pos-outfield";
  return"";
}

function positionHTML(pos){
  return '<span class="pos '+positionClass(pos)+'">'+
    (POS_NAME[pos]||pos)+
    '</span>';
}

function statRows(p){
  let rows=[];

  if(p.t==="B"){
    const a=[
      ["ミート","mt"],
      ["パワー","pw"],
      ["走力","sp"],
      ["肩力","am"],
      ["守備","fd"]
    ];

    a.forEach(x=>{
      const v=Number((p.ab||{})[x[1]]||0);
      const r=rankOf(v);

      rows.push(
        '<div class="stat">'+
          '<span class="statName">'+x[0]+'</span>'+
          '<span class="rank" style="color:'+rankColor(v)+'">'+r+'</span>'+
          '<div class="bar"><i style="width:'+Math.min(v,99)+'%;background:'+rankColor(v)+'"></i></div>'+
          '<span class="statValue">'+v+'</span>'+
        '</div>'
      );
    });

  }else{
    const a=[
      ["球速","vl"],
      ["制球","ct"],
      ["スタミナ","st"],
      ["変化球","br"]
    ];

    a.forEach(x=>{
      const v=Number((p.ap||{})[x[1]]||0);
      const r=rankOf(v);

      rows.push(
        '<div class="stat">'+
          '<span class="statName">'+x[0]+'</span>'+
          '<span class="rank" style="color:'+rankColor(v)+'">'+r+'</span>'+
          '<div class="bar"><i style="width:'+Math.min(v,99)+'%;background:'+rankColor(v)+'"></i></div>'+
          '<span class="statValue">'+v+'</span>'+
        '</div>'
      );
    });
  }

  return rows.join("");
}

function peakText(p){
  if(!p.peak)return"不明";

  const names=p.t==="B"
    ? [["ミート","mt"],["パワー","pw"],["走力","sp"],["肩","am"],["守備","fd"]]
    : [["球速","vl"],["制球","ct"],["スタミナ","st"],["変化球","br"]];

  return '<div class="peakBox">'+
    names.map(x=>{
      const v=Number(p.peak[x[1]]||0);
      return '<span class="peakStat"><b>'+x[0]+'</b>'+v+'</span>';
    }).join("")+
  '</div>';
}

function abilityText(p){
  const sa=Array.isArray(p.sa)?p.sa:[];

  if(!sa.length){
    return '<span class="noAbility">なし</span>';
  }

  return '<div class="abilityList">'+
    sa.map(id=>{
      const name=ABILITY_NAME[id]||id;
      const cls=GOOD_ABILITIES.has(id)
        ?"good"
        :BAD_ABILITIES.has(id)
          ?"bad"
          :"";

      return '<span class="ab '+cls+'">'+name+'</span>';
    }).join("")+
  '</div>';
}

function defenseName(pos){
  return POS_NAME[pos]||pos;
}

function defenseText(p){
  if(p.t==="P" || !p.df){
    return "なし";
  }

  const order=["C","1B","2B","3B","SS","OF"];
  const arr=[];

  order.forEach(pos=>{
    const v=Number(p.df[pos]||0);

    if(v>0){
      const mark=v>=3?"◎":v===2?"○":"△";
      arr.push(
        '<span class="defenseItem">'+
        '<span class="defenseMain">'+defenseName(pos)+'</span>'+
        ' '+mark+
        '</span>'
      );
    }
  });

  return arr.length?'<div class="defenseList">'+arr.join("")+'</div>':"なし";
}

function roleText(p){
  if(p.t!=="P" || !p.rl){
    return"なし";
  }

  const a=[];

  if(Number(p.rl.sp||0)>0)a.push("先発");
  if(Number(p.rl.rp||0)>0)a.push("中継ぎ");
  if(Number(p.rl.cl||0)>0)a.push("抑え");

  return a.length?a.join(" / "):"なし";
}

function potText(p){
  return POT_NAME[p.pot] || "-";
}

function basicText(p){
  const arr=[];

  arr.push(positionHTML(p.pos));
  arr.push((p.t==="P"?"投手":"野手"));
  arr.push(p.age+"歳");
  arr.push(p.bt+"打");
  arr.push(p.th+"投");

  return arr.join(" / ");
}

function rankBadge(v){
  const r=rankOf(v);

  return '<span class="badge rankBadge" style="background:'+RANK_COLOR[r]+'">'+
    r+
  '</span>';
}

function cardHTML(p){
  const team=TEAM_MAP[p.team];
  const teamColor=team ? team.col : "#999";
  const overall=overallOf(p);
  const rank=rankOf(overall);

  return `
    <article class="card" style="--team-color:${teamColor}">
      <div class="teamLine"></div>

      <div class="cardBody">
        <div class="cardHead">
          <div>
            <div class="team">${team ? team.nm : "不明"}</div>
            <div class="name">${p.nm}</div>
            <div class="basic">${basicText(p)}</div>
          </div>
        </div>

        <div class="summary">
          <span class="badge">総合 ${overall.toFixed(1)}</span>
          ${rankBadge(overall)}
          <span class="badge">潜在 ${potText(p)}</span>
          <span class="badge">在籍 ${Number(p.years||0)}年</span>
        </div>

        <div class="statTitle">能力値</div>
        ${statRows(p)}

        <div class="info">

          <div>
            <b>ピーク記録：</b>
            ${peakText(p)}
          </div>

          ${p.t==="P"
            ? `<div><b>地力：</b>${pitchValue(p).toFixed(1)}</div>`
            :""
          }

          ${p.t==="B"
            ? `<div><b>守備適性：</b>${defenseText(p)}</div>`
            :""
          }

          ${p.t==="P"
            ? `<div><b>投手起用：</b>${roleText(p)}</div>`
            :""
          }

          <div>
            <b>特殊能力：</b>
            ${abilityText(p)}
          </div>

          <div>
            <b>ドラフト：</b>
            ${p.drft
              ? `${p.drft.y||"-"}年 ${p.drft.rd ? p.drft.rd+"位" : ""} ${p.drft.src||""}`
              :"不明"
            }
          </div>

        </div>
      </div>
    </article>
  `;
}

/* ============================================================
 * フィルター
 * ============================================================ */

const selectedPositions=new Set();
const selectedRoles=new Set();
let includeSub=false;

function roleMatches(p){
  if(!selectedRoles.size){
    return true;
  }

  if(p.t!=="P" || !p.rl){
    return false;
  }

  for(const r of selectedRoles){
    if(Number(p.rl[r]||0)>0){
      return true;
    }
  }

  return false;
}

function positionMatches(p){
  if(!selectedPositions.size){
    return true;
  }

  if(p.t==="P"){
    return false;
  }

  for(const pos of selectedPositions){

    if(p.pos===pos){
      return true;
    }

    if(includeSub && p.df && Number(p.df[pos]||0)>0){
      return true;
    }
  }

  return false;
}

function overallMatches(p){
  const v=overallOf(p);
  const f=document.getElementById("overallFilter").value;

  if(!f)return true;

  const min={
    S:90,
    A:80,
    B:70,
    C:60,
    D:50
  }[f];

  return v>=min;
}

function ageMatches(p){
  const f=document.getElementById("ageFilter").value;

  if(!f)return true;

  const age=Number(p.age||0);

  if(f==="31")return age>=31;

  return age<=Number(f);
}

function potMatches(p){
  const f=document.getElementById("potFilter").value;

  if(!f)return true;

  return Number(p.pot||0)>=Number(f);
}

function gapMatches(p){
  const f=document.getElementById("gapFilter").value;

  if(!f)return true;

  return peakGap(p)>=Number(f);
}

function applyFilters(){

  const league=document.getElementById("league").value;
  const team=document.getElementById("team").value;
  const type=document.getElementById("type").value;

  let arr=PLAYERS.filter(p=>{

    const tm=TEAM_MAP[p.team];

    if(league && (!tm || tm.lg!==league)){
      return false;
    }

    if(team && String(p.team)!==team){
      return false;
    }

    if(type && p.t!==type){
      return false;
    }

    if(!overallMatches(p)){
      return false;
    }

    if(!ageMatches(p)){
      return false;
    }

    if(!potMatches(p)){
      return false;
    }

    if(!gapMatches(p)){
      return false;
    }

    if(!positionMatches(p)){
      return false;
    }

    if(!roleMatches(p)){
      return false;
    }

    return true;
  });

  sortPlayers(arr);

  document.getElementById("count").textContent=
    arr.length+"人表示 / "+PLAYERS.length+"人";

  const cards=document.getElementById("cards");

  if(!arr.length){
    cards.innerHTML='<div class="empty">条件に一致する選手はいません。</div>';
    return;
  }

  cards.innerHTML=arr.map(cardHTML).join("");
}

function sortPlayers(arr){

  const key=document.getElementById("sort").value;
  const order=document.getElementById("order").value;
  const mul=order==="asc"?1:-1;

  arr.sort((a,b)=>{

    let av,bv;

    if(key==="overall"){
      av=overallOf(a);
      bv=overallOf(b);
    }
    else if(key==="age"){
      av=Number(a.age||0);
      bv=Number(b.age||0);
    }
    else if(key==="pot"){
      av=Number(a.pot||0);
      bv=Number(b.pot||0);
    }
    else if(key==="gap"){
      av=peakGap(a);
      bv=peakGap(b);
    }
    else{
      av=String(a.nm||"");
      bv=String(b.nm||"");

      return av.localeCompare(bv,"ja")*mul;
    }

    return (av-bv)*mul;
  });
}

/* ============================================================
 * 初期化
 * ============================================================ */

function setupTeamFilter(){

  const select=document.getElementById("team");

  Object.keys(TEAM_MAP).forEach(id=>{
    const t=TEAM_MAP[id];

    const op=document.createElement("option");
    op.value=id;
    op.textContent=t.nm;
    select.appendChild(op);
  });
}

function bindControls(){

  [
    "league",
    "team",
    "type",
    "sort",
    "order",
    "overallFilter",
    "ageFilter",
    "potFilter",
    "gapFilter"
  ].forEach(id=>{
    document.getElementById(id).addEventListener("change",applyFilters);
  });

  document.querySelectorAll("[data-pos]").forEach(btn=>{
    btn.addEventListener("click",()=>{

      const pos=btn.dataset.pos;

      if(selectedPositions.has(pos)){
        selectedPositions.delete(pos);
        btn.classList.remove("active");
      }else{
        selectedPositions.add(pos);
        btn.classList.add("active");
      }

      applyFilters();
    });
  });

  document.querySelectorAll("[data-role]").forEach(btn=>{
    btn.addEventListener("click",()=>{

      const role=btn.dataset.role;

      if(selectedRoles.has(role)){
        selectedRoles.delete(role);
        btn.classList.remove("active");
      }else{
        selectedRoles.add(role);
        btn.classList.add("active");
      }

      applyFilters();
    });
  });

  document.getElementById("subPosition").addEventListener("click",e=>{
    includeSub=!includeSub;
    e.currentTarget.classList.toggle("active",includeSub);
    applyFilters();
  });
}

function decodeBase64Url(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");

  while(s.length%4){
    s+="=";
  }

  const bin=atob(s);
  const arr=new Uint8Array(bin.length);

  for(let i=0;i<bin.length;i++){
    arr[i]=bin.charCodeAt(i);
  }

  return arr;
}

async function decompressData(arr){

  const ds=new DecompressionStream("deflate");
  const stream=new Blob([arr]).stream().pipeThrough(ds);
  const reader=stream.getReader();

  const chunks=[];
  let total=0;

  while(true){
    const {value,done}=await reader.read();

    if(done)break;

    chunks.push(value);
    total+=value.length;
  }

  const out=new Uint8Array(total);
  let offset=0;

  for(const chunk of chunks){
    out.set(chunk,offset);
    offset+=chunk.length;
  }

  return new TextDecoder().decode(out);
}

async function load(){

  try{

    const hash=location.hash.slice(1);

    if(!hash){
      throw new Error("URLデータがありません");
    }

    const bytes=decodeBase64Url(hash);
    const text=await decompressData(bytes);

    DATA=JSON.parse(text);

    if(!DATA || !Array.isArray(DATA.players)){
      throw new Error("選手データが見つかりません");
    }

    PLAYERS=DATA.players;

    setupTeamFilter();
    bindControls();
    applyFilters();

  }catch(e){

    console.error(e);

    document.getElementById("cards").innerHTML=
      '<div class="empty">'+
      'データの読み込みに失敗しました。<br>'+
      '保存用URLが正しいか確認してください。'+
      '</div>';
  }
}

load();
</script>
