<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在籍選手データベース</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#f3f4f6;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif
}

h1{
  margin:0 0 6px;
  font-size:24px
}

.sub{
  color:#666;
  font-size:13px;
  margin-bottom:16px
}

.panel{
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center
}

label{
  font-size:13px;
  color:#444
}

select,
input,
button{
  font-size:14px;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff
}

input{
  width:70px
}

button{
  cursor:pointer
}

button.active{
  background:#333;
  color:#fff;
  border-color:#333
}

button.subActive{
  background:#666;
  color:#fff;
  border-color:#666
}

.sectionTitle{
  font-size:13px;
  font-weight:700;
  margin:12px 0 6px
}

.count{
  margin-top:10px;
  font-size:13px;
  color:#666
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px
}

.card{
  background:#fff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:1px solid #e5e7eb;
  min-width:0
}

.cardHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:10px
}

.team{
  font-size:12px;
  color:#666
}

.name{
  font-size:20px;
  font-weight:700;
  margin-top:2px
}

.basic{
  font-size:13px;
  color:#555;
  margin-top:3px
}

.summary{
  display:flex;
  gap:8px;
  margin:10px 0;
  flex-wrap:wrap
}

.badge{
  padding:5px 8px;
  border-radius:7px;
  background:#f0f0f0;
  font-size:13px;
  font-weight:600
}

.statTitle{
  font-size:13px;
  font-weight:700;
  margin:10px 0 5px
}

.stat{
  display:grid;
  grid-template-columns:58px 34px 1fr 24px;
  gap:5px;
  align-items:center;
  font-size:12px;
  margin:4px 0
}

.bar{
  height:9px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:#555;
  border-radius:99px
}

.rank{
  font-weight:700;
  text-align:center
}

.info{
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:8px;
  font-size:12px;
  line-height:1.7
}

.info b{
  font-weight:700
}

.abilities{
  margin-top:5px
}

.good{
  color:#176b3a
}

.bad{
  color:#a33
}

.peak{
  color:#555
}

.hidden{
  display:none
}

.positionButtons,
.roleButtons{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.positionButtons button,
.roleButtons button{
  padding:6px 9px;
  font-size:12px
}

.small{
  font-size:11px;
  color:#777
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media(max-width:650px){
  body{
    padding:10px
  }

  .grid{
    grid-template-columns:1fr
  }

  .card{
    padding:12px
  }
}
</style>
</head>

<body>

<h1>在籍選手データベース</h1>
<div class="sub" id="yearText">データを読み込んでいます…</div>

<div class="panel">

  <div class="controls">
    <label>
      リーグ
      <select id="leagueFilter">
        <option value="ALL">全リーグ</option>
        <option value="C">Cリーグ</option>
        <option value="P">Pリーグ</option>
      </select>
    </label>

    <label>
      球団
      <select id="teamFilter"></select>
    </label>

    <label>
      種別
      <select id="typeFilter">
        <option value="ALL">全員</option>
        <option value="P">投手</option>
        <option value="B">野手</option>
      </select>
    </label>

    <label>
      並び順
      <select id="sortFilter">
        <option value="overall">総合値</option>
        <option value="pot">潜在</option>
        <option value="age">年齢</option>
        <option value="name">名前</option>
        <option value="peakGap">現在→ピーク</option>
      </select>
    </label>

    <button id="orderBtn">↓ 高い順</button>
  </div>

  <div class="sectionTitle">総合値フィルター</div>

  <div class="controls">
    <label>
      最低
      <input id="overallMin" type="number" min="0" max="99" placeholder="0">
    </label>

    <label>
      最高
      <input id="overallMax" type="number" min="0" max="99" placeholder="99">
    </label>

    <label>
      年齢
      <input id="ageMin" type="number" min="0" max="99" placeholder="0">
    </label>

    <label>
      〜
      <input id="ageMax" type="number" min="0" max="99" placeholder="99">
    </label>

    <label>
      潜在
      <select id="potFilter">
        <option value="ALL">指定なし</option>
        <option value="5">S</option>
        <option value="4">A</option>
        <option value="3">B</option>
        <option value="2">C</option>
        <option value="1">D</option>
        <option value="SA">S・A</option>
        <option value="AB">A・B以上</option>
      </select>
    </label>

    <label>
      プロスペクト
      <select id="prospectFilter">
        <option value="ALL">指定なし</option>
        <option value="YOUNG_HIGH">若手＋高潜在</option>
        <option value="HIGH_POT">高潜在</option>
        <option value="GAP">伸びしろ大</option>
        <option value="AWAKEN">若手＋低現能力</option>
      </select>
    </label>
  </div>

  <div class="sectionTitle">守備位置</div>

  <div class="positionButtons">
    <button class="posBtn active" data-pos="ALL">全部</button>
    <button class="posBtn" data-pos="C">捕手</button>
    <button class="posBtn" data-pos="1B">一塁</button>
    <button class="posBtn" data-pos="2B">二塁</button>
    <button class="posBtn" data-pos="3B">三塁</button>
    <button class="posBtn" data-pos="SS">遊撃</button>
    <button class="posBtn" data-pos="OF">外野</button>
  </div>

  <div class="controls" style="margin-top:7px">
    <button id="subPosBtn">サブ守備適性も含める：OFF</button>
  </div>

  <div class="sectionTitle">投手起用</div>

  <div class="roleButtons">
    <button class="roleBtn active" data-role="ALL">全部</button>
    <button class="roleBtn" data-role="sp">先発</button>
    <button class="roleBtn" data-role="rp">中継ぎ</button>
    <button class="roleBtn" data-role="cl">抑え</button>
  </div>

  <div class="count" id="count"></div>
</div>

<div class="grid" id="grid"></div>

<script>

const TEAM_DATA=[
  {idx:0,nm:"東京クラウンズ",sh:"東京",ab:"TKC",lg:"C",col:"#d4a017"},
  {idx:1,nm:"横浜DeNAベイスターズ",sh:"横浜",ab:"YKS",lg:"C",col:"#1d6fd6"},
  {idx:2,nm:"名古屋シャークズ",sh:"名古屋",ab:"NGS",lg:"C",col:"#0e9aa7"},
  {idx:3,nm:"京都ウルブズ",sh:"京都",ab:"KYW",lg:"C",col:"#7c3aed"},
  {idx:4,nm:"大阪サンダーズ",sh:"大阪",ab:"OST",lg:"C",col:"#e8500a"},
  {idx:5,nm:"広島フェニックス",sh:"広島",ab:"HRP",lg:"C",col:"#dc2626"},
  {idx:6,nm:"札幌ベアーズ",sh:"札幌",ab:"SPB",lg:"P",col:"#92400e"},
  {idx:7,nm:"仙台フロンティアーズ",sh:"仙台",ab:"SDF",lg:"P",col:"#b91c1c"},
  {idx:8,nm:"埼玉ファルコンズ",sh:"埼玉",ab:"STF",lg:"P",col:"#1e3a8a"},
  {idx:9,nm:"千葉オーシャンズ",sh:"千葉",ab:"CBO",lg:"P",col:"#0284c7"},
  {idx:10,nm:"神戸ブレイカーズ",sh:"神戸",ab:"KBB",lg:"P",col:"#059669"},
  {idx:11,nm:"福岡ブレイズ",sh:"福岡",ab:"FKB",lg:"P",col:"#ea580c"}
];

const POS_NAMES={
  P:"投手",
  C:"捕手",
  "1B":"一塁",
  "2B":"二塁",
  "3B":"三塁",
  SS:"遊撃",
  OF:"外野"
};

const POS_KEYS=["C","1B","2B","3B","SS","OF"];

const POT_NAMES={
  5:"S",
  4:"A",
  3:"B",
  2:"C",
  1:"D"
};

const GROWTH_NAMES={
  early:"早熟",
  normal:"普通",
  late:"晩成",
  long:"持続"
};

const ABILITY_NAMES={
  avgHit:"アベレージヒッター",
  powHit:"パワーヒッター",
  wideAng:"広角打法",
  chance3:"チャンス◎",
  chance2:"チャンス○",
  vsLeftB3:"対左投手◎",
  vsAce:"対エース◎",
  katame:"固め打ち",
  shokyu:"初球攻撃",
  nebari:"粘り打ち",
  manrui:"満塁男",
  sayonara:"サヨナラ男",
  gyakkyo:"逆境◎",
  kaimaku:"開幕男",
  natsu:"夏男",
  aki:"秋男",
  daida:"代打の神様",
  bunt:"バント職人",
  shobu:"勝負強さ",
  steal3:"盗塁◎",
  baserun3:"走塁◎",
  headsl:"ヘッドスライディング",
  fldArt:"守備職人",
  laser:"レーザービーム",
  throw3:"送球◎",
  lead3:"リード◎",
  block3:"盗塁阻止◎",
  nobi:"ノビ◎",
  kire:"キレ◎",
  omoi:"重い球",
  vsPinch:"対ピンチ◎",
  vsLeftP3:"対左打者◎",
  tough:"打たれ強い",
  quick:"クイック◎",
  kensei:"牽制◎",
  kSama:"奪三振",
  kanto:"完投型",
  tetsuwan:"鉄腕",
  hikeshi:"火消し",
  shiriagari:"尻上がり",
  kachiun:"勝ち運",
  ironBody:"ケガしにくい",
  recover:"回復◎",
  mood:"ムードメーカー",
  ninki:"人気者",
  toushi:"闘志",
  vetAji:"ベテランの味",
  bigstage:"大舞台◎",
  omatsuri:"お祭り男",
  gapHit:"二塁打製造機",
  vsRightB3:"対右投手◎",
  soku:"快足",
  badball:"悪球打ち",
  leadoff:"切り込み隊長",
  gekitetsu:"激鉄",
  groundball:"ゴロ投手",
  noWalk:"精密機械",
  lateStopper:"守護神",
  vsRightP3:"対右打者◎",
  lucky:"強運",
  cleanup:"クリーンナップ",
  lowerStar:"下位の主役",
  second:"ローテの柱",

  sanshin:"三振癖",
  heisatsu:"併殺癖",
  chanceX:"チャンス×",
  vsLeftBX:"対左投手×",
  murake:"ムラっ気",
  slowB:"スロースターター",
  stealX:"盗塁×",
  throwX:"送球難",
  errorPr:"エラー癖",
  ippatsu:"一発病",
  yonkyu:"四球癖",
  slowP:"スロースターター",
  makeun:"負け運",
  tanki:"短気",
  fragGlass:"打たれ弱い",
  glassBody:"ケガしやすい",
  tofu:"豆腐メンタル"
};

let players=[];

let selectedLeague="ALL";
let selectedTeam="MY";
let selectedType="ALL";

let selectedPositions=[];
let selectedRoles=[];

let includeSubPosition=false;

let sortMode="overall";
let descending=true;

function teamOf(p){
  return TEAM_DATA[Number(p.team)] || null;
}

function teamName(p){
  const t=teamOf(p);
  return t ? t.nm : "不明球団";
}

function leagueOf(p){
  const t=teamOf(p);
  return t ? t.lg : "";
}

function rankOf(v){
  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";
  return"G";
}

function overallOf(p){
  if(p.t==="B"){
    return(
      (p.ab.mt+
       p.ab.pw+
       p.ab.sp+
       p.ab.am+
       p.ab.fd)/5
    );
  }

  return(
    (p.ap.vl+
     p.ap.ct+
     p.ap.st+
     p.ap.br)/4
  );
}

function pitchValue(p){
  return(
    p.ap.vl*0.30+
    p.ap.ct*0.30+
    p.ap.st*0.16+
    p.ap.br*0.24
  );
}

function abilityText(p){

  if(!p.sa || !p.sa.length){
    return"なし";
  }

  let good=[];
  let bad=[];

  p.sa.forEach(id=>{
    const n=ABILITY_NAMES[id]||id;

    if([
      "sanshin","heisatsu","chanceX","vsLeftBX","murake",
      "slowB","stealX","throwX","errorPr","ippatsu","yonkyu",
      "slowP","makeun","tanki","fragGlass","glassBody","tofu"
    ].includes(id)){
      bad.push(n);
    }else{
      good.push(n);
    }
  });

  let html="";

  if(good.length){
    html+='<span class="good">'+good.join("、")+"</span>";
  }

  if(bad.length){
    if(html)html+=" / ";
    html+='<span class="bad">'+bad.join("、")+"</span>";
  }

  return html||"なし";
}

function phaseOf(p){

  if(p.t==="P" && !p.ap)return"";

  let peakAge;

  if(p.gt==="early"){
    peakAge=23;
  }else if(p.gt==="normal"){
    peakAge=26;
  }else if(p.gt==="late"){
    peakAge=29;
  }else{
    peakAge=25;
  }

  if(p.age<peakAge)return"成長期";

  let endAge;

  if(p.gt==="early")endAge=27;
  else if(p.gt==="normal")endAge=30;
  else if(p.gt==="late")endAge=33;
  else endAge=33;

  if(p.age<=endAge)return"ピーク期";

  return"衰え期";
}

function statRows(p){

  let rows=[];

  if(p.t==="B"){

    const a=[
      ["ミート","mt"],
      ["パワー","pw"],
      ["走力","sp"],
      ["肩力","am"],
      ["守備","fd"]
    ];

    a.forEach(x=>{
      const v=Number(p.ab[x[1]]||0);

      rows.push(
        '<div class="stat">'+
        '<span>'+x[0]+'</span>'+
        '<span class="rank">'+rankOf(v)+'</span>'+
        '<div class="bar"><i style="width:'+v+'%"></i></div>'+
        '<span>'+v+'</span>'+
        '</div>'
      );
    });

  }else{

    const a=[
      ["球速","vl"],
      ["制球","ct"],
      ["スタミナ","st"],
      ["変化球","br"]
    ];

    a.forEach(x=>{
      const v=Number(p.ap[x[1]]||0);

      rows.push(
        '<div class="stat">'+
        '<span>'+x[0]+'</span>'+
        '<span class="rank">'+rankOf(v)+'</span>'+
        '<div class="bar"><i style="width:'+v+'%"></i></div>'+
        '<span>'+v+'</span>'+
        '</div>'
      );
    });
  }

  return rows.join("");
}

function peakText(p){

  if(!p.peak)return"不明";

  let vals=[];

  if(p.t==="B"){
    vals=[
      p.peak.mt,
      p.peak.pw,
      p.peak.sp,
      p.peak.am,
      p.peak.fd
    ];
  }else{
    vals=[
      p.peak.vl,
      p.peak.ct,
      p.peak.st,
      p.peak.br
    ];
  }

  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;

  return avg.toFixed(1)+" ("+rankOf(avg)+")";
}

function peakGap(p){

  if(!p.peak)return 0;

  let cur=overallOf(p);

  let peak;

  if(p.t==="B"){
    peak=(
      p.peak.mt+
      p.peak.pw+
      p.peak.sp+
      p.peak.am+
      p.peak.fd
    )/5;
  }else{
    peak=(
      p.peak.vl+
      p.peak.ct+
      p.peak.st+
      p.peak.br
    )/4;
  }

  return peak-cur;
}

function defenseText(p){

  if(p.t!=="B" || !p.df)return"—";

  let arr=[];

  POS_KEYS.forEach(pos=>{
    const v=Number(p.df[pos]||0);

    if(v>0){
      arr.push(
        POS_NAMES[pos]+
        (v===3?"◎":v===2?"○":"△")
      );
    }
  });

  return arr.length?arr.join("、"):"—";
}

function roleText(p){

  if(p.t!=="P" || !p.rl)return"—";

  let arr=[];

  if(p.rl.sp>0)arr.push("先発");
  if(p.rl.rp>0)arr.push("中継ぎ");
  if(p.rl.cl>0)arr.push("抑え");

  return arr.length?arr.join("、"):"—";
}

function draftText(p){

  if(!p.drft)return"—";

  const d=p.drft;

  if(!d.y)return"—";

  return d.y+"年 "+
    (d.rd?d.rd+"位 ":"")+
    (d.src||"");
}

function positionMatches(p){

  if(p.t==="P")return true;

  if(!selectedPositions.length)return true;

  for(const pos of selectedPositions){

    if(includeSubPosition){
      if(Number(p.df && p.df[pos] || 0)>0){
        return true;
      }
    }else{
      if(Number(p.df && p.df[pos] || 0)===3){
        return true;
      }
    }
  }

  return false;
}

function roleMatches(p){

  if(!selectedRoles.length)return true;

  if(p.t!=="P")return false;

  for(const role of selectedRoles){
    if(Number(p.rl && p.rl[role] || 0)>0){
      return true;
    }
  }

  return false;
}

function potMatches(p){

  const v=Number(p.pot||0);

  const f=document.getElementById("potFilter").value;

  if(f==="ALL")return true;
  if(f==="SA")return v>=4;
  if(f==="AB")return v>=3;

  return v===Number(f);
}

function prospectMatches(p){

  const f=document.getElementById("prospectFilter").value;

  if(f==="ALL")return true;

  const o=overallOf(p);
  const pot=Number(p.pot||0);

  if(f==="YOUNG_HIGH"){
    return p.age<=23 && pot>=4;
  }

  if(f==="HIGH_POT"){
    return pot>=4;
  }

  if(f==="GAP"){
    return peakGap(p)>=10;
  }

  if(f==="AWAKEN"){
    return p.age<=23 && o<60 && pot>=3;
  }

  return true;
}

function card(p){

  const o=overallOf(p);
  const rank=rankOf(o);
  const team=teamOf(p);

  let summary="";

  summary+=
    '<span class="badge">総合 '+o.toFixed(1)+
    " ("+rank+")</span>";

  summary+=
    '<span class="badge">潜在 '+(POT_NAMES[p.pot]||p.pot)+
    "</span>";

  summary+=
    '<span class="badge">'+
    (GROWTH_NAMES[p.gt]||p.gt)+
    "</span>";

  summary+=
    '<span class="badge">'+
    phaseOf(p)+
    "</span>";

  let basic=[];

  basic.push("年齢 "+p.age);

  if(p.t==="B"){
    basic.push("右投"+(p.bt==="L"?"左打":p.bt==="S"?"両打":"右打"));
    basic.push(POS_NAMES[p.pos]||p.pos);
  }else{
    basic.push((p.th==="L"?"左投":"右投"));
    basic.push("投手");
  }

  let role=roleText(p);

  return `
    <div class="card">

      <div class="cardHead">
        <div>
          <div class="team">
            ${team ? team.nm : "不明"}
            ${team ? " / "+team.lg+"リーグ" : ""}
          </div>
          <div class="name">${p.nm}</div>
          <div class="basic">${basic.join(" / ")}</div>
        </div>

        <div class="rank">${rank}</div>
      </div>

      <div class="summary">
        ${summary}
      </div>

      <div class="statTitle">
        能力値
      </div>

      ${statRows(p)}

      <div class="info">

        <div>
          <b>ピーク能力：</b>
          <span class="peak">${peakText(p)}</span>
        </div>

        <div>
          <b>現在との差：</b>
          <span class="peak">約${peakGap(p).toFixed(1)}</span>
        </div>

        ${
          p.t==="P"
          ?
          '<div><b>地力：</b>'+pitchValue(p).toFixed(1)+
          " ("+rankOf(pitchValue(p))+")</div>"
          :
          ""
        }

        ${
          p.t==="B"
          ?
          '<div><b>守備適性：</b>'+defenseText(p)+'</div>'
          :
          ""
        }

        ${
          p.t==="P"
          ?
          '<div><b>投手起用：</b>'+role+'</div>'
          :
          ""
        }

        <div>
          <b>特殊能力：</b>
          <div class="abilities">${abilityText(p)}</div>
        </div>

        <div>
          <b>ドラフト：</b>${draftText(p)}
        </div>

        <div>
          <b>在籍年数：</b>${p.years||0}年
        </div>

      </div>
    </div>
  `;
}

function applyFilters(){

  const league=
    document.getElementById("leagueFilter").value;

  const type=
    document.getElementById("typeFilter").value;

  const overallMin=
    Number(document.getElementById("overallMin").value||0);

  const overallMax=
    Number(document.getElementById("overallMax").value||99);

  const ageMin=
    Number(document.getElementById("ageMin").value||0);

  const ageMax=
    Number(document.getElementById("ageMax").value||99);

  return players.filter(p=>{

    if(league!=="ALL" && leagueOf(p)!==league){
      return false;
    }

    if(selectedTeam==="MY"){
      if(Number(p.team)!==1)return false;
    }else if(selectedTeam!=="ALL"){
      if(Number(p.team)!==Number(selectedTeam)){
        return false;
      }
    }

    if(type!=="ALL" && p.t!==type){
      return false;
    }

    if(p.age<ageMin || p.age>ageMax){
      return false;
    }

    const o=overallOf(p);

    if(o<overallMin || o>overallMax){
      return false;
    }

    if(!potMatches(p)){
      return false;
    }

    if(!prospectMatches(p)){
      return false;
    }

    if(p.t==="B" && !positionMatches(p)){
      return false;
    }

    if(!roleMatches(p)){
      return false;
    }

    return true;
  });
}

function sortPlayers(arr){

  const key=sortMode;

  arr.sort((a,b)=>{

    let av;
    let bv;

    if(key==="overall"){
      av=overallOf(a);
      bv=overallOf(b);
    }else if(key==="pot"){
      av=Number(a.pot||0);
      bv=Number(b.pot||0);
    }else if(key==="age"){
      av=Number(a.age||0);
      bv=Number(b.age||0);
    }else if(key==="name"){
      av=a.nm||"";
      bv=b.nm||"";
    }else if(key==="peakGap"){
      av=peakGap(a);
      bv=peakGap(b);
    }

    if(typeof av==="string"){
      return descending
        ? bv.localeCompare(av,"ja")
        : av.localeCompare(bv,"ja");
    }

    return descending
      ? bv-av
      : av-bv;
  });

  return arr;
}

function render(){

  const grid=document.getElementById("grid");

  let arr=applyFilters();

  sortPlayers(arr);

  document.getElementById("count").textContent=
    arr.length+"人表示 / 全"+players.length+"人";

  /*
   * 一度にinnerHTMLへ流し込むことで、
   * 792人程度でも個別DOM追加を繰り返さない。
   */
  grid.innerHTML=arr.map(card).join("");
}

function setupTeamFilter(){

  const select=document.getElementById("teamFilter");

  let html="";

  html+='<option value="MY">自球団（横浜）</option>';
  html+='<option value="ALL">全球団</option>';

  TEAM_DATA.forEach(t=>{
    html+=
      '<option value="'+t.idx+'">'+
      t.nm+
      " ("+t.lg+")"+
      "</option>";
  });

  select.innerHTML=html;

  select.value="MY";
}

function setupEvents(){

  document.getElementById("leagueFilter")
    .addEventListener("change",()=>{

      selectedLeague=
        document.getElementById("leagueFilter").value;

      const team=
        document.getElementById("teamFilter");

      if(selectedLeague==="ALL"){
        /*
         * 何もしない。
         * 球団選択はそのまま維持。
         */
      }else{

        /*
         * 選択中球団が別リーグなら全球団に戻す。
         */
        if(selectedTeam!=="ALL" &&
           selectedTeam!=="MY"){

          const t=TEAM_DATA[Number(selectedTeam)];

          if(t && t.lg!==selectedLeague){
            selectedTeam="ALL";
            team.value="ALL";
          }
        }
      }

      render();
    });

  document.getElementById("teamFilter")
    .addEventListener("change",e=>{
      selectedTeam=e.target.value;
      render();
    });

  document.getElementById("typeFilter")
    .addEventListener("change",()=>{

      selectedType=
        document.getElementById("typeFilter").value;

      render();
    });

  document.getElementById("sortFilter")
    .addEventListener("change",e=>{
      sortMode=e.target.value;
      render();
    });

  document.getElementById("orderBtn")
    .addEventListener("click",e=>{

      descending=!descending;

      e.target.textContent=
        descending
        ?"↓ 高い順"
        :"↑ 低い順";

      render();
    });

  [
    "overallMin",
    "overallMax",
    "ageMin",
    "ageMax",
    "potFilter",
    "prospectFilter"
  ].forEach(id=>{

    document.getElementById(id)
      .addEventListener("input",render);

    document.getElementById(id)
      .addEventListener("change",render);
  });

  document.querySelectorAll(".posBtn")
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        const pos=btn.dataset.pos;

        if(pos==="ALL"){

          selectedPositions=[];

          document.querySelectorAll(".posBtn")
            .forEach(x=>x.classList.remove("active"));

          btn.classList.add("active");

        }else{

          document.querySelector('[data-pos="ALL"]')
            .classList.remove("active");

          if(selectedPositions.includes(pos)){

            selectedPositions=
              selectedPositions.filter(x=>x!==pos);

            btn.classList.remove("active");

          }else{

            selectedPositions.push(pos);
            btn.classList.add("active");
          }

          if(selectedPositions.length===0){
            document.querySelector('[data-pos="ALL"]')
              .classList.add("active");
          }
        }

        render();
      });
    });

  document.getElementById("subPosBtn")
    .addEventListener("click",e=>{

      includeSubPosition=!includeSubPosition;

      e.target.textContent=
        "サブ守備適性も含める："+
        (includeSubPosition?"ON":"OFF");

      e.target.classList.toggle(
        "subActive",
        includeSubPosition
      );

      render();
    });

  document.querySelectorAll(".roleBtn")
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        const role=btn.dataset.role;

        if(role==="ALL"){

          selectedRoles=[];

          document.querySelectorAll(".roleBtn")
            .forEach(x=>x.classList.remove("active"));

          btn.classList.add("active");

        }else{

          document.querySelector('[data-role="ALL"]')
            .classList.remove("active");

          if(selectedRoles.includes(role)){

            selectedRoles=
              selectedRoles.filter(x=>x!==role);

            btn.classList.remove("active");

          }else{

            selectedRoles.push(role);
            btn.classList.add("active");
          }

          if(selectedRoles.length===0){
            document.querySelector('[data-role="ALL"]')
              .classList.add("active");
          }
        }

        render();
      });
    });
}

async function loadData(){

  try{

    const hash=
      location.hash.replace(/^#/,"");

    if(!hash){
      throw new Error("URLデータがありません");
    }

    let s=
      hash.replace(/-/g,"+")
          .replace(/_/g,"/");

    while(s.length%4)s+="=";

    const bin=atob(s);

    const bytes=new Uint8Array(bin.length);

    for(let i=0;i<bin.length;i++){
      bytes[i]=bin.charCodeAt(i);
    }

    const ds=
      new DecompressionStream("deflate");

    const stream=
      new Blob([bytes])
        .stream()
        .pipeThrough(ds);

    const ab=
      await new Response(stream).arrayBuffer();

    const json=
      new TextDecoder().decode(ab);

    const data=
      JSON.parse(json);

    players=
      Array.isArray(data.players)
      ?data.players
      :[];

    document.getElementById("yearText").textContent=
      (data.year||"不明")+"年度・在籍選手 "+
      players.length+"人";

    setupTeamFilter();
    setupEvents();
    render();

  }catch(e){

    console.error(e);

    document.getElementById("yearText").textContent=
      "データを読み込めませんでした";

    document.getElementById("grid").innerHTML=
      '<div class="panel">'+
      "URLデータの読み込みに失敗しました。"+
      "<br><span class='small'>"+
      String(e.message||e)+
      "</span></div>";
  }
}

loadData();

</script>
