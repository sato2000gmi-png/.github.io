}

.crossSearchLabel{

.filterLabel{

.rawData{

.emptyValue{

.detailMiniTable{

  .searchArea{margin-top:8px;flex-wrap:wrap}
  .nameSearch{width:100%;flex:none}
  .detailGrid{grid-template-columns:1fr}
  .detailName{font-size:22px}
}

/* =========================================================

let yearData={};

let selectedYear="";
let selectedLeague="ALL";

let includeSub=false;

let sortMode="overall";

let careerData=null;
let careerPromise=null;

const RENDER_STEP=150;
let renderLimit=RENDER_STEP;
let searchTimer=null;


/* =========================================================
   基本処理
   ========================================================= */

function rankOf(v){
  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";
  return"G";
}

function overallOf(p){
  if(p.t==="B"){
    return(
      (Number(p.ab?.mt)||0)+
      (Number(p.ab?.pw)||0)+
      (Number(p.ab?.sp)||0)+
      (Number(p.ab?.am)||0)+
      (Number(p.ab?.fd)||0)
    )/5;
  }

  return(
    (Number(p.ap?.vl)||0)+
    (Number(p.ap?.ct)||0)+
    (Number(p.ap?.st)||0)+
    (Number(p.ap?.br)||0)
  )/4;
}

function pitchValue(p){
  return(
    (Number(p.ap?.vl)||0)*.30+
    (Number(p.ap?.ct)||0)*.30+
    (Number(p.ap?.st)||0)*.16+
    (Number(p.ap?.br)||0)*.24
  );
}

function positionClass(pos){
  if(pos==="P")return"pos-pitcher";
  if(pos==="C")return"pos-catcher";
  if(pos==="1B"||pos==="2B"||pos==="3B"||pos==="SS")return"pos-infield";
  if(pos==="OF")return"pos-outfield";
  return"";
}

function positionBadge(pos){
  return`<span class="posBadge ${positionClass(pos)}">${POS_NAMES[pos]||pos}</span>`;
}

function abilityText(p){
  if(!p.sa||!p.sa.length)return"なし";

  return p.sa.map(x=>{
    const name=ABILITY_NAMES[x]||x;

    if(GOOD_ABILITIES.has(x)){
      return`<span class="good">${name}</span>`;
    }

    if(BAD_ABILITIES.has(x)){
      return`<span class="bad">${name}</span>`;
    }

    return`<span class="normalAbility">${name}</span>`;
  }).join("、");
}

function phaseOf(p){
  let peakS,peakE;

  if(p.gt==="early"){
    peakS=23; peakE=27;
  }else if(p.gt==="normal"){
    peakS=26; peakE=30;
  }else if(p.gt==="late"){
    peakS=29; peakE=33;
  }else{
    peakS=25; peakE=33;
  }

  if(p.age<peakS)return"成長期";
  if(p.age<=peakE)return"ピーク";
  return"衰退期";
}

function rankClass(v){
  return"rank-"+rankOf(v);
}

function barClass(v){
  return"bar-"+rankOf(v);
}

function statRows(p){
  let arr=[];

  if(p.t==="B"){
    arr=[
      ["ミート",p.ab?.mt],
      ["パワー",p.ab?.pw],
      ["走力",p.ab?.sp],
      ["肩力",p.ab?.am],
      ["守備",p.ab?.fd]
    ];
  }else{
    arr=[
      ["球速",p.ap?.vl],
      ["制球",p.ap?.ct],
      ["スタ",p.ap?.st],
      ["変化",p.ap?.br]
    ];
  }

  return arr.map(x=>{
    let v=Number(x[1])||0;
    let r=rankOf(v);

    return`<div class="stat">
      <span>${x[0]}</span>
      <span class="${rankClass(v)}">${v}</span>
      <div class="bar">
        <i class="${barClass(v)}" style="width:${Math.min(v,99)}%"></i>
      </div>
      <span class="rank ${rankClass(v)}">${r}</span>
    </div>`;
  }).join("");
}

function peakText(p){
  if(!p.peak)return"不明";

  if(p.t==="B"){
    return`<span class="peakStats">
      <span class="peakStat"><b>ミート</b>${p.peak.mt}</span>　
      <span class="peakStat"><b>パワー</b>${p.peak.pw}</span>　
      <span class="peakStat"><b>走力</b>${p.peak.sp}</span>　
      <span class="peakStat"><b>肩</b>${p.peak.am}</span>　
      <span class="peakStat"><b>守備</b>${p.peak.fd}</span>
    </span>`;
  }

  return`<span class="peakStats">
    <span class="peakStat"><b>球速</b>${p.peak.vl}</span>　
    <span class="peakStat"><b>制球</b>${p.peak.ct}</span>　
    <span class="peakStat"><b>スタミナ</b>${p.peak.st}</span>　
    <span class="peakStat"><b>変化球</b>${p.peak.br}</span>
  </span>`;
}

function peakGap(p){
  if(!p.peak)return 0;

  if(p.t==="B"){
    return(
      (Number(p.peak.mt)||0)-(Number(p.ab?.mt)||0)+
      (Number(p.peak.pw)||0)-(Number(p.ab?.pw)||0)+
      (Number(p.peak.sp)||0)-(Number(p.ab?.sp)||0)+
      (Number(p.peak.am)||0)-(Number(p.ab?.am)||0)+
      (Number(p.peak.fd)||0)-(Number(p.ab?.fd)||0)
    );
  }

  return(
    (Number(p.peak.vl)||0)-(Number(p.ap?.vl)||0)+
    (Number(p.peak.ct)||0)-(Number(p.ap?.ct)||0)+
    (Number(p.peak.st)||0)-(Number(p.ap?.st)||0)+
    (Number(p.peak.br)||0)-(Number(p.ap?.br)||0)
  );
}

function defenseText(p){
  if(p.t==="P"||!p.df)return"—";

  let a=[];

  for(let k in p.df){
    if(p.df[k]>0){
      let lv=p.df[k];
      let mark=lv>=3?"◎":lv===2?"○":"△";
      a.push((POS_NAMES[k]||k)+mark);
    }
  }

  return a.length?a.join("、"):"—";
}

function roleMark(v){
  v=Number(v)||0;
  if(v>=3)return"◎";
  if(v===2)return"○";
  if(v===1)return"△";
  return"—";
}

function roleText(p){
  if(p.t!=="P"||!p.rl)return"—";

  let a=[];

  if(Number(p.rl.sp)>0)a.push("先発"+roleMark(p.rl.sp));
  if(Number(p.rl.rp)>0)a.push("中継ぎ"+roleMark(p.rl.rp));
  if(Number(p.rl.cl)>0)a.push("抑え"+roleMark(p.rl.cl));

  return a.length?a.join("、"):"—";

function roleDetailText(p){

/* =========================================================
   成績計算
   ========================================================= */

function battingAverage(s){
  let ab=Number(s?.AB)||0;
  let h=Number(s?.H)||0;

  return ab>0?h/ab:null;
}

function slugging(s){
  let ab=Number(s?.AB)||0;
  let h=Number(s?.H)||0;
  let d2=Number(s?.D2)||0;
  let d3=Number(s?.D3)||0;
  let hr=Number(s?.HR)||0;

  if(!ab)return null;

  let tb=h+d2+(2*d3)+(3*hr);
  return tb/ab;
}

function obpApprox(s){
  let ab=Number(s?.AB)||0;
  let h=Number(s?.H)||0;
  let bb=Number(s?.BB)||0;

  if(ab+bb<=0)return null;

  return(h+bb)/(ab+bb);
}

function opsApprox(s){
  let obp=obpApprox(s);
  let slg=slugging(s);

  if(obp===null||slg===null)return null;

  return obp+slg;
}

function era(s){
  let ipo=Number(s?.IPo)||0;
  let er=Number(s?.ER)||0;

  if(!ipo)return null;

  return(er*27)/ipo;
}

function whip(s){
  let ipo=Number(s?.IPo)||0;
  let h=Number(s?.H)||0;
  let bb=Number(s?.BB)||0;

  if(!ipo)return null;

  return((h+bb)*3)/ipo;
}

function inningsText(ipo){
  ipo=Number(ipo)||0;

  let whole=Math.floor(ipo/3);
  let rem=ipo%3;

  return`${whole}.${rem}`;
}

function fmtAvg(v){
  return v===null||v===undefined?"—":v.toFixed(3).replace(/^0/,"");
}

function fmtNum(v,digits=2){
  return v===null||v===undefined?"—":Number(v).toFixed(digits);
}

function fmtOps(v){
  if(v===null||v===undefined)return"—";

  let s=Number(v).toFixed(3);

  if(Number(v)<1){
    s=s.replace(/^0/,"");
  }

  return s;
}

function seasonSummary(p,s,y){
  if(!s)return"";

  if(p.t==="B"){
    let avg=battingAverage(s);
    let ops=opsApprox(s);

    return`
      <div class="seasonSummaryYear">${y}年</div>
      <div class="seasonSummaryStats">
        ${Number(s.G)||0}試合
        ${fmtAvg(avg)}
        ${Number(s.HR)||0}本
        ${Number(s.RBI)||0}打点
        ${Number(s.SB)||0}盗塁
        OPS ${fmtOps(ops)}
      </div>
    `;
  }

  let erav=era(s);
  let whipv=whip(s);

  return`
    <div class="seasonSummaryYear">${y}年</div>
    <div class="seasonSummaryStats">
      ${Number(s.G)||0}試合
      ${inningsText(s.IPo)}回
      防御率 ${fmtNum(erav,2)}
      ${Number(s.W)||0}勝${Number(s.L)||0}敗
      ${Number(s.GS)||0}先発
      ${Number(s.HLD)||0}H
      ${Number(s.SV)||0}S
      WHIP ${fmtNum(whipv,3)}
    </div>
  `;
}

function getSeasonStats(p,year){
  year=Number(year);

  // まず確定済みの年度成績を優先
  if(Array.isArray(p.hist)){
    let h=p.hist.find(x=>Number(x.y)===year);

    if(h&&h.s){
      return h.s;
    }
  }

  // 現在選択している年度の現役選手なら、
  // まだhistに入っていない年度途中の成績をcsから取得
  if(
    Number(year)===Number(selectedYear)&&
    p.cs
  ){
    return p.cs;
  }

  // 全年度横断検索時の年度途中データ
  if(
    p.__year&&
    Number(p.__year)===year&&
    p.cs
  ){
    return p.cs;
  }

  return null;
}

function sumStats(list,keys){
  let out={};

  keys.forEach(k=>out[k]=0);

  for(let s of list||[]){
    for(let k of keys){
      out[k]+=(Number(s?.[k])||0);
    }
  }

  return out;
}

function careerTotalsFromHist(p){
  let hist=Array.isArray(p.hist)?p.hist:[];

  if(!hist.length)return null;

  if(p.t==="B"){
    return sumStats(
      hist.map(x=>x.s||{}),
      ["G","PA","AB","H","D2","D3","HR","RBI","R","SB","BB","SO"]
    );
  }

  return sumStats(
    hist.map(x=>x.s||{}),
    ["G","GS","W","L","SV","HLD","IPo","H","HR","BB","SO","ER","CG"]
  );
}


/* =========================================================
   URL・検索状態
   ========================================================= */

function normalizeSearchText(s){
  return String(s||"")
    .normalize("NFKC")
    .toLocaleLowerCase()
    .replace(/[\s\u3000]+/g,"");
}

function searchTokens(){
  return String(searchName||"")
    .normalize("NFKC")
    .trim()
    .split(/[\s\u3000]+/)
    .filter(Boolean)
    .map(x=>x.toLocaleLowerCase());
}

function idTokenMatches(p,token){
  let id=String(p.id||"").normalize("NFKC").toLocaleLowerCase();
  let num=id.replace(/^p/,"");

  let t=String(token||"")
    .normalize("NFKC")
    .toLocaleLowerCase()
    .replace(/[\s\u3000]+/g,"");

  t=t.replace(/^no\./,"");

  if(/^p\d+$/.test(t)){
    return id===t;
  }

  if(/^\d+$/.test(t)){
    return num===t;
  }

  return false;
}

function nameMatches(p){
  if(!searchName)return true;

  let tokens=searchTokens();
  let normalizedName=normalizeSearchText(p.nm);

  return tokens.every(token=>{
    if(idTokenMatches(p,token)){
      return true;
    }

    return normalizedName.includes(
      normalizeSearchText(token)
    );
  });
}

function currentListUrl(){
  let url=new URL(location.href);

  url.search="";
  url.hash="";

  let params=new URLSearchParams();

  if(searchName){
    params.set("q",searchName);
  }

  if(crossYearSearch){
    params.set("cross","1");
  }

  if(selectedYear){
    params.set("year",selectedYear);
  }

  let query=params.toString();

  return url.pathname+(query?"?"+query:"");
}

function syncListUrl(){
  if(!document.getElementById("nameSearch"))return;

  let url=new URL(location.href);
  let params=new URLSearchParams(url.search);

  if(searchName){
    params.set("q",searchName);
  }else{
    params.delete("q");
  }

  if(crossYearSearch){
    params.set("cross","1");
  }else{
    params.delete("cross");
  }

  if(selectedYear){
    params.set("year",selectedYear);
  }

  params.delete("id");
  params.delete("from");

  let query=params.toString();

  let newUrl=
    url.pathname+
    (query?"?"+query:"")+
    url.hash;

  history.replaceState(null,"",newUrl);
}

function detailUrl(id){
  let url=new URL(location.href);

  url.search="";
  url.hash="";

  let params=new URLSearchParams();
  params.set("id",id);
  params.set(
    "from",
    currentListUrl()
  );

  return url.pathname+"?"+params.toString();
}

function getReturnUrl(params){
  let from=params.get("from");

  if(!from){
    return"players.html";
  }

  try{
    let u=new URL(from,location.href);

    if(
      u.origin===location.origin&&
      /\/players\.html$/.test(u.pathname)
    ){
      return u.pathname+u.search;
    }
  }catch(e){}

  return"players.html";
}

function restoreListState(params){
  searchName=
    params.get("q")||"";

  crossYearSearch=
    params.get("cross")==="1";

  return params.get("year")||"";
}

/* =========================================================
   フィルター
   ========================================================= */

function positionMatches(p){
  if(selectedPositions.has("ALL"))return true;

  for(let pos of selectedPositions){

    if(pos==="P"){
      if(p.t==="P")return true;
      continue;
    }

    if(p.t!=="B")continue;

    if(p.pos===pos)return true;

    if(
      includeSub&&
      p.df&&
      Number(p.df[pos]||0)>0
    ){
      return true;
    }
  }

  return false;
}

function roleMatches(p){
  if(p.t!=="P"){
    return selectedRoles.size===0;
  }

  if(selectedRoles.size===0)return true;
  if(!p.rl)return false;

  for(let role of selectedRoles){
    let lv=Number(p.rl[role]||0);

    if(excludeLowRole){
      if(lv>=2)return true;
    }else{
      if(lv>0)return true;
    }
  }

  return false;
}

function baseFilter(p){

  if(selectedLeague!=="ALL"){
    let team=TEAM_MAP[p.team];

    if(!team||team.lg!==selectedLeague){
      return false;
    }
  }

  if(
    selectedTeam!=="ALL"&&
    selectedTeam!=="MY"&&
    String(p.team)!==selectedTeam
  ){
    return false;
  }

  if(
    selectedTeam==="MY"&&
    String(p.team)!=="1"
  ){
    return false;
  }

  if(!positionMatches(p))return false;
  if(!roleMatches(p))return false;

  if(
    selectedPots.size>0&&
    !selectedPots.has(Number(p.pot))
  ){
    return false;
  }

  if(
    selectedGrowths.size>0&&
    !selectedGrowths.has(p.gt)
  ){
    return false;
  }

  return true;
}


/* =========================================================
   検索結果作成
   ========================================================= */

function applyFilters(){

  if(crossYearSearch&&!searchName){
    return [];
  }

  let arr=[];

  if(!crossYearSearch){

    for(let p of players){

      if(!nameMatches(p))continue;
      if(!baseFilter(p))continue;

      arr.push(p);
    }

  }else{

    for(let y of availableYears){

      let list=yearData[y]||[];

      for(let p of list){

        if(!nameMatches(p))continue;
        if(!baseFilter(p))continue;

        arr.push(
          Object.assign({},p,{__year:y})
        );
      }
    }
  }

  arr.sort((a,b)=>{

    let x,y;

    if(sortMode==="overall"){
      x=overallOf(a);
      y=overallOf(b);

    }else if(sortMode==="pot"){
      x=a.pot;
      y=b.pot;

    }else if(sortMode==="age"){
      x=a.age;
      y=b.age;

    }else if(sortMode==="name"){

      let result=
        String(a.nm||"")
        .localeCompare(
          String(b.nm||""),
          "ja"
        );

      if(result!==0){
        return descending?-result:result;
      }

      return descending
        ?String(b.id||"").localeCompare(String(a.id||""))
        :String(a.id||"").localeCompare(String(b.id||""));

    }else{

      x=peakGap(a);
      y=peakGap(b);
    }

    if(x!==y){
      return descending?y-x:x-y;
    }

    return String(a.id||"")
      .localeCompare(String(b.id||""));
  });

  return arr;
}

function render(){

  let grid=document.getElementById("grid");
  let moreArea=document.getElementById("moreArea");

  if(crossYearSearch&&!searchName){

    document.getElementById("count").textContent=
      "全年度横断検索：選手名またはNo.を入力してください";

    grid.innerHTML=
      `<div class="searchNotice">
        選手名またはNo.を入力すると、保存されている全年度から検索します。
      </div>`;

    moreArea.classList.remove("show");
    return;
  }

  let arr=applyFilters();

  let totalText=
    crossYearSearch
      ?`全${availableYears.length}年度`
      :`全${players.length}人`;

  let visible=
    arr.slice(0,renderLimit);

  document.getElementById("count").textContent=
    arr.length>visible.length
      ?`表示：${visible.length}人 / 検索結果 ${arr.length}人 / ${totalText}`
      :`表示：${arr.length}人 / ${totalText}`;

  grid.innerHTML=
    visible.map(card).join("");

  if(arr.length>visible.length){

    moreArea.classList.add("show");

    document.getElementById("moreBtn").textContent=
      `もっと見る（残り${arr.length-visible.length}人）`;

  }else{

    moreArea.classList.remove("show");
  }
}

function resetAndRender(){
  renderLimit=RENDER_STEP;
  render();
}


/* =========================================================
   GitHubデータ読み込み
   ========================================================= */

async function fetchGitHubYears(){

  let res=await fetch(
    GITHUB_API_BASE+"?ref=main&per_page=100",
    {cache:"no-store"}
  );

  if(!res.ok){
    throw new Error(
      "GitHub年度一覧取得失敗：HTTP "+res.status
    );
  }

  let files=await res.json();

  githubYears=
    files
      .filter(x=>
        x.type==="file"&&
        /^\d{4}\.json\.gz$/.test(x.name)
      )
      .map(x=>
        x.name.replace(/\.json\.gz$/,"")
      )
      .sort((a,b)=>Number(b)-Number(a));
}

async function fetchYearFromGitHub(year){

  year=String(year);

  if(githubLoadedYears.has(year)){
    return yearData[year]||[];
  }

  if(loadingPromises[year]){
    return loadingPromises[year];
  }

  loadingPromises[year]=
    (async()=>{

      let url=
        GITHUB_RAW_BASE+
        "/"+
        encodeURIComponent(year)+
        ".json.gz";

      let res=await fetch(
        url,
        {cache:"no-cache"}
      );

      if(!res.ok){
        throw new Error(
          `${year}年度データ取得失敗：HTTP ${res.status}`
        );
      }

      let compressed=
        new Uint8Array(
          await res.arrayBuffer()
        );

      let ds=
        new DecompressionStream("gzip");

      let writer=
        ds.writable.getWriter();

      let reader=
        ds.readable.getReader();

      writer.write(compressed);
      writer.close();

      let chunks=[];
      let x;

      while(!(x=await reader.read()).done){
        chunks.push(x.value);
      }

      let total=
        chunks.reduce(
          (n,a)=>n+a.length,
          0
        );

      let out=new Uint8Array(total);
      let off=0;

      for(let c of chunks){
        out.set(c,off);
        off+=c.length;
      }

      let text=
        new TextDecoder().decode(out);

      let data=
        JSON.parse(text);

      if(!Array.isArray(data.players)){
        throw new Error(
          `${year}年度データの形式が正しくありません`
        );
      }

      yearData[year]=data.players;
      githubLoadedYears.add(year);

      return yearData[year];

    })();

  try{
    return await loadingPromises[year];
  }finally{
    delete loadingPromises[year];
  }
}

async function ensureYearLoaded(year){

  year=String(year);

  if(githubYears.includes(year)){
    return await fetchYearFromGitHub(year);
  }

  if(
    Object.prototype.hasOwnProperty.call(
      yearData,
      year
    )
  ){
    return yearData[year];
  }

  throw new Error(
    `${year}年度のデータが見つかりません`
  );
}

async function ensureAllYearsLoaded(){

  await Promise.all(
    availableYears.map(
      year=>ensureYearLoaded(year)
    )
  );
}


/* =========================================================
   CAREER読み込み
   ========================================================= */

async function fetchCareer(){

  if(careerData)return careerData;
  if(careerPromise)return careerPromise;

  careerPromise=(async()=>{

    let res=await fetch(
      CAREER_API_URL,
      {cache:"no-cache"}
    );

    if(!res.ok){
      throw new Error(
        "CAREERデータ取得失敗：HTTP "+res.status
      );
    }

    let compressed=
      new Uint8Array(
        await res.arrayBuffer()
      );

    let ds=
      new DecompressionStream("gzip");

    let writer=
      ds.writable.getWriter();

    let reader=
      ds.readable.getReader();

    writer.write(compressed);
    writer.close();

    let chunks=[];
    let x;

    while(!(x=await reader.read()).done){
      chunks.push(x.value);
    }

    let total=
      chunks.reduce(
        (n,a)=>n+a.length,
        0
      );

    let out=new Uint8Array(total);
    let off=0;

    for(let c of chunks){
      out.set(c,off);
      off+=c.length;
    }

    careerData=
      JSON.parse(
        new TextDecoder().decode(out)
      );

    return careerData;

  })();

  try{
    return await careerPromise;
  }finally{
    careerPromise=null;
  }
}


/* =========================================================
   旧URLデータ
   ========================================================= */

async function decodeLegacyHash(){

  let hash=location.hash.slice(1);

  if(!hash)return null;

  hash=
    hash
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  while(hash.length%4){
    hash+="=";
  }

  let bin=atob(hash);
  let u=new Uint8Array(bin.length);

  for(let i=0;i<bin.length;i++){
    u[i]=bin.charCodeAt(i);
  }

  let ds=
    new DecompressionStream("deflate");

  let writer=
    ds.writable.getWriter();

  let reader=
    ds.readable.getReader();

  writer.write(u);
  writer.close();

  let chunks=[];
  let x;

  while(!(x=await reader.read()).done){
    chunks.push(x.value);
  }

  let total=
    chunks.reduce(
      (n,a)=>n+a.length,
      0
    );

  let out=new Uint8Array(total);
  let off=0;

  for(let c of chunks){
    out.set(c,off);
    off+=c.length;
  }

  return JSON.parse(
    new TextDecoder().decode(out)
  );
}

function latestPlayerSnapshot(id){

  let found=null;
  let foundYear=-Infinity;

  for(let y of availableYears){

    let list=yearData[y]||[];

    for(let p of list){

      if(String(p.id)===String(id)){

        let ny=Number(y);

        if(ny>foundYear){
          found=Object.assign({},p,{__year:y});
          foundYear=ny;
        }
      }
    }
  }

  return found;
}

/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHtml(s){
  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   初期状態復元
   ========================================================= */

function applyRestoredSearchState(params){

  let input=
    document.getElementById("nameSearch");

  let cross=
    document.getElementById("crossYearSearch");

  if(input){
    input.value=searchName;
  }

  if(cross){
    cross.checked=crossYearSearch;
  }
}


/* =========================================================
   初期ロード
   ========================================================= */

async function loadData(){

  let params=
    new URLSearchParams(location.search);

  let detailId=
    params.get("id");

  if(detailId){
    await renderDetail(
      detailId,
      params
    );
    return;
  }

  /*
   * ?q= / ?cross= / ?year= を一覧状態として復元。
   */
  let requestedYear=
    restoreListState(params);

  setup();
  applyRestoredSearchState(params);

  let hash=location.hash.slice(1);

  if(hash){

    try{

      let data=
        await decodeLegacyHash();

      if(data.years){

        for(let y of Object.keys(data.years)){
          yearData[String(y)]=data.years[y];
        }

      }else if(data.players){

        let y=
          String(data.year||"?");

        yearData[y]=data.players;

      }else{

        throw new Error(
          "対応していない旧URLデータ形式です"
        );
      }

    }catch(e){

      console.error(
        "旧URLデータ読み込み失敗",
        e
      );
    }
  }

  let githubError=null;

  try{

    await fetchGitHubYears();

  }catch(e){

    console.error(e);
    githubError=e;
    githubYears=[];
  }

  rebuildAvailableYears();

  if(!availableYears.length){

    document.getElementById("yearText").textContent=
      githubError
        ?"GitHubから年度データを取得できませんでした。"
        :"保存されている年度データがありません。";

    document.getElementById("count").textContent=
      "データなし";

    return;
  }

  /*
   * URLに年度指定があり、その年度が存在するなら優先。
   * なければ最新年度。
   */
  let firstYear=
    requestedYear&&availableYears.includes(String(requestedYear))
      ?String(requestedYear)
      :availableYears[0];

  try{

    let list=
      await ensureYearLoaded(firstYear);

    players=list;

    updateYearText(firstYear);

    /*
     * URLから復元した検索条件を反映。
     */
    let input=
      document.getElementById("nameSearch");

    let cross=
      document.getElementById("crossYearSearch");

    if(input){
      input.value=searchName;
    }

    if(cross){
      cross.checked=crossYearSearch;
    }

    if(crossYearSearch&&searchName){
      await refreshCrossYearSearch();
    }else{
      render();
    }

  }catch(e){

    console.error(e);

    if(
      Object.prototype.hasOwnProperty.call(
        yearData,
        firstYear
      )
    ){

      players=yearData[firstYear];

      updateYearText(firstYear);
      render();

    }else{

      document.getElementById("yearText").textContent=
        `${firstYear}年度データの読み込みに失敗しました。`;

      document.getElementById("count").textContent=
        e.message;
    }
  }
}

loadData();
