<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドラフト候補データベース</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px 12px;
}

h1{
  font-size:20px;
  margin:0 0 2px;
}

.subtitle{
  font-size:12px;
  color:#777;
  margin:0 0 8px;
}

.headerInfo{
  font-size:12px;
  color:#555;
  margin-bottom:8px;
}

.controls{
  display:flex;
  gap:5px 8px;
  flex-wrap:wrap;
  align-items:center;
}

.controlGroup{
  display:flex;
  align-items:center;
  gap:4px;
}

button,
select,
input[type="text"]{
  font-size:12px;
  padding:4px 7px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
}

button{
  cursor:pointer;
}

button:active{
  background:#eee;
}

button.active{
  background:#e9eef5;
  border-color:#8a9aaa;
  font-weight:600;
}

input[type="text"]{
  width:240px;
  max-width:100%;
}

.filterBlock{
  margin-top:6px;
  padding-top:6px;
  border-top:1px solid #eee;
  font-size:12px;
}

.filterTitle{
  display:inline-block;
  font-size:12px;
  font-weight:700;
  margin-right:5px;
}

.filterButtons{
  display:inline-flex;
  gap:3px;
  flex-wrap:wrap;
  align-items:center;
}

.filterButtons button{
  padding:3px 7px;
  font-size:12px;
}

.checkLine{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-left:7px;
  font-size:12px;
  white-space:nowrap;
  vertical-align:middle;
}

.checkLine input{
  margin:0;
}

.roleLine{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-left:8px;
  white-space:nowrap;
  vertical-align:middle;
}

.roleLine select{
  padding:3px 6px;
  font-size:12px;
}

.positionOptions{
  display:inline-flex;
  align-items:center;
  gap:8px;
  vertical-align:middle;
}

.positionOptions .checkLine{
  margin-left:0;
}

.positionOptions .roleLine{
  margin-left:0;
}

.positionOptions .roleLine .checkLine{
  margin-left:0;
}

.sortLine{
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.sortLine select{
  min-width:105px;
}

#info{
  margin-top:6px;
  font-size:12px;
  color:#777;
}

#cards{
  max-width:1100px;
  margin:auto;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px 10px;
}

.card{
  border:1px solid #ccc;
  border-radius:8px;
  padding:12px;
  background:#fafafa;
  overflow:hidden;
}

.card h3{
  font:600 19px sans-serif;
  margin:0 0 1px;
  padding-bottom:0;
  border-bottom:none;
}

.basic{
  font-size:11px;
  line-height:1.4;
  white-space:nowrap;
}

.playerNo{
  color:#999;
  font-size:10px;
  white-space:nowrap;
}

.cardDivider{
  margin:6px 0 5px;
  border-top:1px solid #ddd;
}

.cardInfo{
  font-size:12px;
  line-height:1.6;
  white-space:nowrap;
}

.stats{
  margin-top:6px;
  padding-top:5px;
  border-top:1px solid #eee;
  white-space:nowrap;
  font-family:monospace;
  font-size:12px;
}

.statrow{
  display:flex;
  align-items:center;
  gap:3px;
  height:20px;
}

.statName{
  display:inline-block;
  width:42px;
}

.num{
  display:inline-block;
  width:27px;
  text-align:right;
}

.grade{
  display:inline-block;
  width:22px;
  font-weight:bold;
  text-align:center;
}

.bar{
  letter-spacing:-1px;
  white-space:nowrap;
}

.extra{
  margin-top:7px;
  padding-top:6px;
  border-top:1px solid #e5e5e5;
  white-space:normal;
  font-size:12px;
  line-height:1.6;
}

.ab{
  font-weight:600;
}

.ab-good{
  color:#dc2626;
}

.ab-bad{
  color:#2563eb;
}

.none{
  color:#888;
}

.apt{
  font-weight:600;
}

.crossYear{
  margin-left:5px;
  padding:1px 4px;
  border-radius:4px;
  background:#eee;
  color:#777;
  font-size:10px;
  font-weight:500;
}

.pos-pitcher{
  color:#d32f2f !important;
  font-weight:700;
}

.pos-catcher{
  color:#1976d2 !important;
  font-weight:700;
}

.pos-infield{
  color:#d89b00 !important;
  font-weight:700;
}

.pos-outfield{
  color:#2e8b57 !important;
  font-weight:700;
}

.cardTools{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
  padding-top:6px;
  border-top:1px solid #e5e5e5;
  flex-wrap:wrap;
}

.markButton{
  font-size:11px;
  padding:3px 6px;
}

.markButton.other{
  border-color:#d98a8a;
  background:#fff2f2;
}

.markButton.self{
  border-color:#7ca68a;
  background:#f0faf3;
}

.markButton.favorite{
  border-color:#d1aa43;
  background:#fff9df;
}

.statusText{
  font-size:11px;
  color:#777;
}

@media(max-width:700px){
  #cards{
    grid-template-columns:repeat(2,1fr);
    gap:14px 10px;
    padding:10px;
  }

  input[type="text"]{
    width:200px;
  }
}

@media(max-width:430px){
  #cards{
    grid-template-columns:1fr;
  }

  input[type="text"]{
    width:100%;
  }
}
</style>
</head>

    <select id="sortOrder">
      <option value="desc">高い順</option>
      <option value="asc">低い順</option>

  </span>
</div>

<div id="info">データを読み込み中…</div>

</header>

<div id="cards"></div>

<script>

/* =========================================================

  {id:"lucky",n:"強運",t:"g"},

  {id:"lowerStar",n:"下位の主役",t:"g"},
  {id:"second",n:"ローテの柱",t:"g"}

];

const ABILITY_MAP={};

ABILITIES.forEach(a=>{
  ABILITY_MAP[a.id]=a;
});


/* =========================================================
   基本データ
   ========================================================= */

const POT_RANK={
  5:"S",
  4:"A",
  3:"B",
  2:"C",
  1:"D"
};

const GROWTH={
  early:"早熟",
  normal:"普通",
  late:"晩成",
  long:"持続"
};

const POS={
  P:"投手",
  C:"捕手",
  "1B":"一塁",
  "2B":"二塁",
  "3B":"三塁",
  SS:"遊撃",
  OF:"外野"
};

const POSITION_LIST=[
  ["P","投手"],
  ["C","捕手"],
  ["1B","一塁"],
  ["2B","二塁"],
  ["3B","三塁"],
  ["SS","遊撃"],
  ["OF","外野"]
];

const POTENTIAL_LIST=[
  ["","全て"],
  [5,"S"],
  [4,"A"],
  [3,"B"],
  [2,"C"],
  [1,"D"]
];

const GROWTH_LIST=[
  ["","全て"],
  ["long","持続"],
  ["late","晩成"],
  ["normal","普通"],
  ["early","早熟"]
];

const DRAFT_LIST=[
  ["","全て"],
  ["none","未指名"],
  ["other","他球団"],
  ["self","自分"]
];

const ABILITY_NAME={
  mt:"ミート",
  pw:"パワー",
  sp:"走力",
  am:"肩",
  fd:"守備",
  vl:"球速",
  ct:"制球",
  st:"スタ",
  br:"変化球"
};

const RANK_COLOR={
  S:"#ff5fa2",
  A:"#f43f5e",
  B:"#fb923c",
  C:"#facc15",
  D:"#a3e635",
  E:"#38bdf8",
  F:"#94a3b8",
  G:"#7d8aa5"
};


/* =========================================================
   手動マーク
   ========================================================= */

const DRAFT_KEY="pennant_draft_marks_v1";
const FAVORITE_KEY="pennant_favorite_marks_v1";

let draftMarks={};
let favoriteMarks={};

function loadMarks(){

  try{
    draftMarks=JSON.parse(
      localStorage.getItem(DRAFT_KEY)||"{}"
    );
  }catch(e){
    draftMarks={};
  }

  try{
    favoriteMarks=JSON.parse(
      localStorage.getItem(FAVORITE_KEY)||"{}"
    );
  }catch(e){
    favoriteMarks={};
  }
}

function saveDraftMarks(){

  try{
    localStorage.setItem(
      DRAFT_KEY,
      JSON.stringify(draftMarks)
    );
  }catch(e){}
}

function saveFavoriteMarks(){

  try{
    localStorage.setItem(
      FAVORITE_KEY,
      JSON.stringify(favoriteMarks)
    );
  }catch(e){}
}


/* =========================================================
   状態
   ========================================================= */

let years={};
let current=[];
let currentYear="";

const filters={
  name:"",
  positions:new Set(),
  includeSubPos:true,
  potential:new Set(),
  growth:new Set(),
  role:"",
  excludeLowRole:false,
  draft:"",
  hideDrafted:false,
  favoriteOnly:false
};

let sortKey="pot";
let sortOrder="desc";


/* =========================================================
   選手キー
   ========================================================= */

function playerKey(x){

  const id=x && x.id
    ? String(x.id)
    : "";

  const name=x && x.nm
    ? String(x.nm)
    : "";

  return String(currentYear)+"|"+(id||name);
}

function draftStatus(x){
  return draftMarks[playerKey(x)]||"none";
}

function isFavorite(x){
  return !!favoriteMarks[playerKey(x)];
}

function setDraftStatus(x,status){

  const key=playerKey(x);

  if(status==="none"){
    delete draftMarks[key];
  }else{
    draftMarks[key]=status;
  }

  saveDraftMarks();
  applyFiltersAndRender();
}

function toggleFavorite(x){

  const key=playerKey(x);

  if(favoriteMarks[key]){
    delete favoriteMarks[key];
  }else{
    favoriteMarks[key]=true;
  }

  saveFavoriteMarks();
  applyFiltersAndRender();
}

function nextDraftStatus(x){

  const now=draftStatus(x);

  if(now==="none"){
    setDraftStatus(x,"other");
  }else if(now==="other"){
    setDraftStatus(x,"self");
  }else{
    setDraftStatus(x,"none");
  }
}


/* =========================================================
   表示関数
   ========================================================= */

function posClass(pos){

  if(pos==="P")return"pos-pitcher";
  if(pos==="C")return"pos-catcher";

  if(["1B","2B","3B","SS"].includes(pos)){
    return"pos-infield";
  }

  if(pos==="OF"){
    return"pos-outfield";
  }

  return"";
}

function rank(v){

  v=Number(v)||0;

  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";

  return"G";
}

function bar(v){

  v=Math.max(
    0,
    Math.min(
      99,
      Number(v)||0
    )
  );

  const blocks=Math.round(v/10);

  return"■".repeat(blocks)+"□".repeat(10-blocks);
}

function total(x){

  const z=x.t==="B"
    ? x.ab
    : x.ap;

  let t=0;

  Object.keys(z||{}).forEach(k=>{
    t+=Number(z[k])||0;
  });

  return t;
}

function apt(v){

  v=Number(v)||0;

  if(v===3)return"◎";
  if(v===2)return"○";
  if(v===1)return"△";

  return"—";
}

function aptColor(v){

  return Number(v)>0
    ? "#222"
    : "#888";
}


/* =========================================================
   利き腕
   ========================================================= */

function handHTML(x){

  const throwHand=
    x.th==="L"
      ?"左投"
      :"右投";

  let batHand="右打";

  if(x.bt==="L"){
    batHand="左打";
  }else if(x.bt==="S"){
    batHand="両打";
  }

  return throwHand+batHand;
}


/* =========================================================
   適性
   ========================================================= */

function defenseHTML(x){

  const order=[
    "C",
    "1B",
    "2B",
    "3B",
    "SS",
    "OF"
  ];

  const df=x.df||{};

  const html=order
    .filter(k=>(Number(df[k])||0)>0)
    .map(k=>{

      const v=Number(df[k])||0;

      return`
        <span
          class="apt"
          style="color:${aptColor(v)}"
        >${POS[k]||k}${apt(v)}</span>
      `;

    })
    .join("　");

  return html||`<span class="none">なし</span>`;
}

function roleHTML(x){

  const q=x.rl||{};

  return`
    <span
      class="apt"
      style="color:${aptColor(q.sp||0)}"
    >先${apt(q.sp||0)}</span>　

    <span
      class="apt"
      style="color:${aptColor(q.rp||0)}"
    >中${apt(q.rp||0)}</span>　

    <span
      class="apt"
      style="color:${aptColor(q.cl||0)}"
    >抑${apt(q.cl||0)}</span>
  `;
}


/* =========================================================
   特殊能力
   ========================================================= */

function specialName(id){

  const a=ABILITY_MAP[String(id)];

  return a
    ? a.n
    : String(id);
}

function specialClass(id){

  const a=ABILITY_MAP[String(id)];

  if(!a){
    return"";
  }

function escapeAttr(v){

}


/* =========================================================
   フィルター
   ========================================================= */

function matchesName(x){

  const q=
    filters.name.trim().toLowerCase();

  if(!q){
    return true;
  }

  return String(x.nm||"")
    .toLowerCase()
    .includes(q);
}

function matchesPosition(x){

  if(!filters.positions.size){
    return true;
  }

  if(filters.positions.has(x.pos)){
    return true;
  }

  if(
    filters.includeSubPos &&
    x.t==="B"
  ){

    const df=x.df||{};

    for(const p of filters.positions){

      if(p==="P"){
        continue;
      }

      if((Number(df[p])||0)>0){
        return true;
      }
    }
  }

  return false;
}

function matchesPotential(x){

  if(filters.potential.size===0){
    return true;
  }

  return filters.potential.has(
    Number(x.pot)
  );
}

function matchesGrowth(x){

  if(filters.growth.size===0){
    return true;
  }

  return filters.growth.has(x.gt);
}

function matchesRole(x){

  if(!filters.role){

    if(
      filters.excludeLowRole &&
      x.t==="P"
    ){

      const q=x.rl||{};

      const maxRole=Math.max(
        Number(q.sp)||0,
        Number(q.rp)||0,
        Number(q.cl)||0
      );

      return maxRole>=2;
    }

    return true;
  }

  if(x.t!=="P"){
    return false;
  }

  const q=x.rl||{};
  const v=Number(q[filters.role])||0;

  if(filters.excludeLowRole){
    return v>=2;
  }

  return v>0;
}

function matchesDraft(x){

  if(filters.draft===""){
    return true;
  }

  return draftStatus(x)===
    filters.draft;
}

function matchesHideDrafted(x){

  if(!filters.hideDrafted){
    return true;
  }

  return draftStatus(x)==="none";
}

function matchesFavorite(x){

  if(!filters.favoriteOnly){
    return true;
  }

  return isFavorite(x);
}

function filterPlayers(arr){

  return arr.filter(x=>{

    if(!matchesName(x))return false;
    if(!matchesPosition(x))return false;
    if(!matchesPotential(x))return false;
    if(!matchesGrowth(x))return false;
    if(!matchesRole(x))return false;
    if(!matchesDraft(x))return false;
    if(!matchesHideDrafted(x))return false;
    if(!matchesFavorite(x))return false;

    return true;
  });
}


/* =========================================================
   並べ替え
   ========================================================= */

function compareName(a,b){

  return String(a.nm||"")
    .localeCompare(
      String(b.nm||""),
      "ja",
      {
        numeric:true,
        sensitivity:"base"
      }
    );
}

function roleValue(x,key){

  return Number(
    (x.rl||{})[key]
  )||0;
}

function compareSort(a,b){

  if(sortKey==="orig"){
    return 0;
  }

  if(sortKey==="name"){

    const n=compareName(a,b);

    return sortOrder==="asc"
      ?n
      :-n;
  }

  let av=0;
  let bv=0;

  if(sortKey==="pot"){

    av=Number(a.pot)||0;
    bv=Number(b.pot)||0;

  }else if(sortKey==="now"){

    av=total(a);
    bv=total(b);

  }else if(sortKey==="age"){

    av=Number(a.age)||0;
    bv=Number(b.age)||0;

  }else if(
    sortKey==="sp"||
    sortKey==="rp"||
    sortKey==="cl"
  ){

    av=roleValue(a,sortKey);
    bv=roleValue(b,sortKey);
  }

  let result=bv-av;

  if(sortOrder==="asc"){
    result=-result;
  }

  if(result===0){

    const potDiff=
      (Number(b.pot)||0)-
      (Number(a.pot)||0);

    if(potDiff!==0){
      return potDiff;
    }

    return compareName(a,b);
  }

  return result;
}

function sortPlayers(arr){

  const result=[...arr];

  if(sortKey==="orig"){
    return result;
  }

  return result.sort(compareSort);
}

function applyFiltersAndRender(){

  const filtered=
    filterPlayers(current);

  const sorted=
    sortPlayers(filtered);

  render(sorted);
}

async function loadYearFromGitHub(y){

  const url=
    GITHUB_DRAFT_RAW_BASE+
    "/"+encodeURIComponent(y)+".json.gz";

  const res=
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!res.ok){

    throw new Error(
      y+"年度データ取得失敗：HTTP "+
      res.status
    );
  }

  const buffer=
    await res.arrayBuffer();

  /*
   * GitHub保存データは gzip 圧縮。
   */
  const ds=
    new DecompressionStream("gzip");

  const stream=
    new Blob([buffer])
      .stream()
      .pipeThrough(ds);

  const text=
    await new Response(stream)
      .text();

  const data=
    JSON.parse(text);

  /*
   * 年度ファイルのデータ形式を吸収する。
   *
   * ① [ {...}, {...} ]
   * ② { candidates:[ {...}, {...} ] }
   * ③ { cands:[ {...}, {...} ] }
   * ④ { y:"2030", d:[ {...}, {...} ] }
   * ⑤ { years:{ "2030":[...] } }
   */

  if(Array.isArray(data)){
    return data;
  }

  if(
    data &&
    Array.isArray(data.candidates)
  ){
    return data.candidates;
  }

  if(
    data &&
    Array.isArray(data.cands)
  ){
    return data.cands;
  }

  if(
    data &&
    data.y!=null &&
    Array.isArray(data.d)
  ){
    return data.d;
  }

  if(
    data &&
    data.years &&
    Array.isArray(data.years[String(y)])
  ){
    return data.years[String(y)];
  }

  throw new Error(
    y+"年度データの形式が不正です"
  );
}

async function switchYear(y){

  if(!y){
    return;
  }

  currentYear=String(y);

  document.getElementById("info").textContent=
    currentYear+"年度のデータを読み込み中…";

  try{

    if(!Array.isArray(years[currentYear])){

      years[currentYear]=
        await loadYearFromGitHub(currentYear);
    }

    current=
      Array.isArray(years[currentYear])
        ?years[currentYear]
        :[];

    setupYears();
    applyFiltersAndRender();

  }catch(e){

    console.error(e);

    current=[];

    document.getElementById("cards").innerHTML=`
      <div style="
        grid-column:1/-1;
        padding:20px;
        color:#777;
      ">
        ${currentYear}年度のデータを読み込めませんでした。<br>
        GitHub上の年度ファイルを確認してください。
      </div>
    `;

    document.getElementById("yearInfo").textContent=
      currentYear+"年度";

    document.getElementById("totalInfo").textContent=
      "全体：0人";

    document.getElementById("matchInfo").textContent=
      "該当：0人";

    document.getElementById("info").textContent=
      "データの読み込みに失敗しました";
  }
}


/* =========================================================
   GitHub年度一覧
   ========================================================= */

async function fetchGitHubYears(){

  const res=
    await fetch(
      GITHUB_DRAFT_API_BASE+
      "?ref=main&per_page=100",
      {
        cache:"no-store"
      }
    );

  if(!res.ok){

    throw new Error(
      "GitHub年度一覧取得失敗：HTTP "+
      res.status
    );
  }

  const files=
    await res.json();

  const result=
    files
      .filter(x=>
        x.type==="file" &&
        /^\d{4}\.json\.gz$/.test(x.name)
      )
      .map(x=>
        x.name.replace(
          /\.json\.gz$/,
          ""
        )
      )
      .sort(
        (a,b)=>Number(b)-Number(a)
      );

  if(!result.length){

    throw new Error(
      "GitHubにドラフト候補年度ファイルがありません"
    );
  }

  return result;
}


/* =========================================================
   旧ハッシュURL用
   ========================================================= */

async function decodeData(hash){

  let s=
    hash
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  while(s.length%4){
    s+="=";
  }

  const binary=
    atob(s);

  const bytes=
    Uint8Array.from(
      binary,
      c=>c.charCodeAt(0)
    );

  const ds=
    new DecompressionStream("deflate");

  const stream=
    new Blob([bytes])
      .stream()
      .pipeThrough(ds);

  const buffer=
    await new Response(stream)
      .arrayBuffer();

  const text=
    new TextDecoder()
      .decode(buffer);

  return JSON.parse(text);
}

      if(pos===""){

        filters.positions.clear();

      }else{

        if(filters.positions.has(pos)){
          filters.positions.delete(pos);
        }else{
          filters.positions.add(pos);
        }

      applyFiltersAndRender();

    .getElementById("potentialButtons")

      }else{

async function load(){

  loadMarks();
  makeButtons();
  bindEvents();
  updateSortOrderUI();

  const hash=
    location.hash.slice(1);

  /*
   * ハッシュがある場合は旧バックアップURLとして扱う。
   * これまで作った巨大URLも引き続き閲覧可能。
   */
  if(hash){

    try{

      const obj=
        await decodeData(hash);

      if(obj.years){

        years=obj.years;

      }else if(
        obj.y!=null &&
        obj.d
      ){

        years[String(obj.y)]=obj.d;

      }else{

        throw new Error(
          "データ形式が不正です"
        );
      }

      const ys=
        Object.keys(years)
          .sort(
            (a,b)=>Number(b)-Number(a)
          );

      if(!ys.length){
        throw new Error(
          "年度データがありません"
        );
      }

      currentYear=ys[0];

      current=
        Array.isArray(years[currentYear])
          ?years[currentYear]
          :[];

      setupYears();
      applyFiltersAndRender();

      document.getElementById("info").textContent=
        "旧バックアップURLのデータを表示中";

      return;

    }catch(e){

      console.warn(
        "旧ハッシュデータの読み込みに失敗しました。GitHubから読み込みます。",
        e
      );
    }
  }


  /*
   * 通常はこちら。
   * GitHubのdata/draft/に存在する年度を自動取得。
   */

  document.getElementById("info").textContent=
    "GitHubから年度一覧を取得中…";

  try{

    const githubYears=
      await fetchGitHubYears();

    years={};

    githubYears.forEach(y=>{
      years[y]=null;
    });

    currentYear=
      githubYears[0];

    setupYears();

    current=
      await loadYearFromGitHub(
        currentYear
      );

    years[currentYear]=current;

    setupYears();
    applyFiltersAndRender();

  }catch(e){

    console.error(e);

    document.getElementById("info").textContent=
      "GitHubからデータを読み込めませんでした";

    document.getElementById("cards").innerHTML=`
      <div style="
        grid-column:1/-1;
        padding:20px;
        color:#777;
      ">
        新人候補データを読み込めませんでした。<br>
        GitHubの data/draft/ に年度ファイルが存在するか確認してください。<br><br>
        ${escapeAttr(e.message||String(e))}
      </div>
    `;
  }
}

load();

</script>

</body>
</html>
