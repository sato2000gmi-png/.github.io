<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ペナントメーカー 新人候補</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px;
}

h1{
  font-size:20px;
  margin:0 0 3px;
}

.subtitle{
  font-size:12px;
  color:#777;
  margin:0 0 10px;
}

.controls{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}

button,select{
  font-size:13px;
  padding:7px 10px;
  border:1px solid #bbb;
  border-radius:7px;
  background:#fff;
}

button:active{
  background:#eee;
}

#info{
  margin-top:8px;
  font-size:12px;
  color:#777;
}

#cards{
  max-width:1100px;
  margin:auto;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px 10px;
}

.card{
  border:1px solid #ccc;
  border-radius:8px;
  padding:9px;
  background:#fafafa;
  overflow:hidden;
}

.card h3{
  font:600 15px sans-serif;
  margin:0 0 5px;
  border-bottom:1px solid #ddd;
  padding-bottom:4px;
}

.basic{
  font-size:12px;
  line-height:1.5;
}

.stats{
  margin-top:6px;
  padding-top:4px;
  border-top:1px solid #eee;
  white-space:nowrap;
  font-family:monospace;
  font-size:12px;
}

.statrow{
  display:flex;
  align-items:center;
  gap:3px;
  height:20px;
}

.name{
  display:inline-block;
  width:42px;
}

.num{
  display:inline-block;
  width:27px;
  text-align:right;
}

.grade{
  display:inline-block;
  width:22px;
  font-weight:bold;
  text-align:center;
}

.bar{
  letter-spacing:-1px;
  white-space:nowrap;
}

.extra{
  margin-top:7px;
  padding-top:6px;
  border-top:1px solid #e5e5e5;
  white-space:normal;
  font-size:12px;
  line-height:1.6;
}

.ab{
  font-weight:600;
}

.none{
  color:#888;
}

.apt{
  font-weight:600;
}

@media(max-width:700px){
  body{
    padding:0;
  }

  #cards{
    grid-template-columns:repeat(2,1fr);
    gap:14px 10px;
    padding:10px;
  }
}

@media(max-width:430px){
  #cards{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>ペナントメーカー 新人候補</h1>
  <p class="subtitle">新人候補スカウティングデータ</p>

  <div class="controls">
    <select id="year"></select>

    <button data-sort="orig">元の順番</button>
    <button data-sort="pot">潜在能力順</button>
    <button data-sort="now">現在能力順</button>
    <button data-sort="pit">投手のみ</button>
    <button data-sort="bat">野手のみ</button>
  </div>

  <div id="info">データを読み込み中…</div>
</header>

<div id="cards"></div>

<script>

const POT_RANK={
  5:"S",
  4:"A",
  3:"B",
  2:"C",
  1:"D"
};

const GROWTH={
  early:"早熟",
  normal:"普通",
  late:"晩成",
  long:"持続"
};

const POS={
  P:"投手",
  C:"捕手",
  "1B":"一塁",
  "2B":"二塁",
  "3B":"三塁",
  SS:"遊撃",
  OF:"外野"
};

const ABILITY_NAME={
  mt:"ミート",
  pw:"パワー",
  sp:"走力",
  am:"肩",
  fd:"守備",
  vl:"球速",
  ct:"制球",
  st:"スタ",
  br:"変化球"
};

const RANK_COLOR={
  S:"#ff5fa2",
  A:"#f43f5e",
  B:"#fb923c",
  C:"#facc15",
  D:"#a3e635",
  E:"#38bdf8",
  F:"#94a3b8",
  G:"#7d8aa5"
};

const GOOD={
  avgHit:"アベレージヒッター",
  powHit:"パワーヒッター",
  wideAng:"広角打法",
  chance3:"チャンス◎",
  chance2:"チャンス○",
  vsLeftB3:"対左投手◎",
  vsAce:"対エース◎",
  katame:"固め打ち",
  shokyu:"初球攻撃",
  nebari:"粘り打ち",
  manrui:"満塁男",
  sayonara:"サヨナラ男",
  gyakkyo:"逆境◎",
  kaimaku:"開幕男",
  natsu:"夏男",
  aki:"秋男",
  daida:"代打の神様",
  bunt:"バント職人",
  shobu:"勝負強さ",

  steal3:"盗塁◎",
  baserun3:"走塁◎",
  headsl:"ヘッドスライディング",

  fldArt:"守備職人",
  laser:"レーザービーム",
  throw3:"送球◎",
  lead3:"リード◎",
  block3:"盗塁阻止◎",

  nobi:"ノビ◎",
  kire:"キレ◎",
  omoi:"重い球",
  vsPinch:"対ピンチ◎",
  vsLeftP3:"対左打者◎",
  tough:"打たれ強い",
  quick:"クイック◎",
  kensei:"牽制◎",
  kSama:"奪三振",
  kanto:"完投型",
  tetsuwan:"鉄腕",
  hikeshi:"火消し",
  shiriagari:"尻上がり",
  kachiun:"勝ち運",

  ironBody:"ケガしにくい",
  recover:"回復◎",

  mood:"ムードメーカー",
  ninki:"人気者",
  toushi:"闘志",
  vetAji:"ベテランの味",
  bigstage:"大舞台◎",
  omatsuri:"お祭り男",

  gapHit:"二塁打製造機",
  vsRightB3:"対右投手◎",
  soku:"快足",
  badball:"悪球打ち",
  leadoff:"切り込み隊長",

  gekitetsu:"激鉄",
  groundball:"ゴロ投手",
  noWalk:"精密機械",
  lateStopper:"守護神",
  vsRightP3:"対右打者◎",
  lucky:"強運",
  cleanup:"クリーンナップ",
  lowerStar:"下位の主役",
  second:"ローテの柱"
};

const BAD={
  sanshin:"三振癖",
  heisatsu:"併殺癖",
  chanceX:"チャンス×",
  vsLeftBX:"対左投手×",
  murake:"ムラっ気",
  slowB:"スロースターター",

  stealX:"盗塁×",
  throwX:"送球難",
  errorPr:"エラー癖",

  ippatsu:"一発病",
  yonkyu:"四球癖",
  slowP:"スロースターター",
  makeun:"負け運",
  tanki:"短気",
  fragGlass:"打たれ弱い",

  glassBody:"ケガしやすい",
  tofu:"豆腐メンタル"
};

let years={};
let current=[];
let currentYear="";
let mode="orig";

function rank(v){
  v=Number(v)||0;

  if(v>=90)return"S";
  if(v>=80)return"A";
  if(v>=70)return"B";
  if(v>=60)return"C";
  if(v>=50)return"D";
  if(v>=40)return"E";
  if(v>=30)return"F";
  return"G";
}

function bar(v){
  v=Math.max(0,Math.min(100,Number(v)||0));

  const n=Math.round(v/5);

  return "█".repeat(n)+"░".repeat(20-n);
}

function total(x){
  const z=x.t==="B"?x.ab:x.ap;

  let t=0;

  Object.keys(z||{}).forEach(k=>{
    t+=Number(z[k])||0;
  });

  return t;
}

function apt(v){
  v=Number(v)||0;

  if(v===3)return"◎";
  if(v===2)return"○";
  if(v===1)return"△";
  return"—";
}

function aptColor(v){
  return Number(v)>0?"#222":"#888";
}

function defenseHTML(x){

  const order=["C","1B","2B","3B","SS","OF"];

  return order
    .filter(k=>(x.df&&x.df[k])>0)
    .map(k=>{
      const v=x.df[k];

      return `
        <span class="apt" style="color:${aptColor(v)}">
          ${(POS[k]||k)}${apt(v)}
        </span>
      `;
    })
    .join("　");
}

function roleHTML(x){

  const q=x.rl||{};

  return `
    <span class="apt" style="color:${aptColor(q.sp||0)}">
      先${apt(q.sp||0)}
    </span>
   　
    <span class="apt" style="color:${aptColor(q.rp||0)}">
      中${apt(q.rp||0)}
    </span>
   　
    <span class="apt" style="color:${aptColor(q.cl||0)}">
      抑${apt(q.cl||0)}
    </span>
  `;
}

function abilityHTML(x){

  const sa=Array.isArray(x.sa)?x.sa:[];

  if(!sa.length){
    return '<span class="none">なし</span>';
  }

  return sa.map(id=>{

    const q=GOOD[id];

    if(q){
      return `<span class="ab" style="color:#dc2626">${q}</span>`;
    }

    const b=BAD[id];

    if(b){
      return `<span class="ab" style="color:#2563eb">${b}</span>`;
    }

    return `<span class="ab">${id}</span>`;

  }).join("　");
}

function abilityHTMLForStat(x){

  const z=x.t==="B"?x.ab:x.ap;

  if(!z)return"";

  return Object.keys(z).map(k=>{

    const v=Number(z[k])||0;
    const q=rank(v);
    const name=ABILITY_NAME[k]||k;

    return `
      <div class="statrow">
        <span class="name">${name}</span>
        <span class="num">${v}</span>
        <b class="grade" style="color:${RANK_COLOR[q]}">[${q}]</b>
        <span class="bar" style="color:${RANK_COLOR[q]}">${bar(v)}</span>
      </div>
    `;

  }).join("");
}

function render(arr){

  let s="";

  arr.forEach((x,i)=>{

    const potential=POT_RANK[x.pot]||"?";
    const potentialColor=RANK_COLOR[potential]||"#777";

    s+=`
      <section class="card">

        <h3>${i+1}. ${x.nm||"名前不明"}</h3>

        <div class="basic">
          ${x.age??"?"}歳　
          <span>${POS[x.pos]||x.pos||"?"}</span>　
          潜在
          <b style="color:${potentialColor}">
            [${potential}]
          </b>
         　
          ${GROWTH[x.gt]||x.gt||""}
        </div>

        <div class="stats">
          ${abilityHTMLForStat(x)}
        </div>

        ${
          x.t==="B"
          ?
          `<div class="extra">
             <b>守備適性</b>　
             ${defenseHTML(x)}
           </div>`
          :
          `<div class="extra">
             <b>起用適性</b>　
             ${roleHTML(x)}
           </div>`
        }

        <div class="extra">
          <b>特殊能力</b>　
          ${abilityHTML(x)}
        </div>

      </section>
    `;
  });

  document.getElementById("cards").innerHTML=s;

  document.getElementById("info").textContent=
    `${currentYear}年度　${arr.length}人`;
}

function sortAndRender(){

  let arr=[...current];

  if(mode==="pot"){
    arr.sort((x,y)=>
      (y.pot||0)-(x.pot||0) ||
      total(y)-total(x)
    );
  }

  if(mode==="now"){
    arr.sort((x,y)=>
      total(y)-total(x) ||
      (y.pot||0)-(x.pot||0)
    );
  }

  if(mode==="pit"){
    arr=arr.filter(x=>x.t==="P");
  }

  if(mode==="bat"){
    arr=arr.filter(x=>x.t==="B");
  }

  render(arr);
}

function setupYears(){

  const select=document.getElementById("year");

  select.innerHTML="";

  Object.keys(years)
    .sort((a,b)=>Number(b)-Number(a))
    .forEach(y=>{

      const o=document.createElement("option");

      o.value=y;
      o.textContent=y+"年度";

      select.appendChild(o);
    });

  if(currentYear && years[currentYear]){
    select.value=currentYear;
  }
}

function switchYear(y){

  if(!years[y])return;

  currentYear=y;
  current=years[y];
  mode="orig";

  setupYears();
  sortAndRender();
}

async function decodeData(hash){

  hash=hash.replace(/^#/,"");

  hash=hash.replace(/-/g,"+").replace(/_/g,"/");

  while(hash.length%4){
    hash+="=";
  }

  const binary=atob(hash);

  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  const ds=new DecompressionStream("deflate");

  const writer=ds.writable.getWriter();

  writer.write(bytes);
  writer.close();

  const reader=ds.readable.getReader();

  const chunks=[];
  let x;

  while(!(x=await reader.read()).done){
    chunks.push(x.value);
  }

  const blob=new Blob(chunks);

  return JSON.parse(await blob.text());
}

async function load(){

  const hash=location.hash.slice(1);

  if(!hash){

    document.getElementById("info").textContent=
      "URLに新人候補データがありません。";

    return;
  }

  try{

    const obj=await decodeData(hash);

    /*
      新形式:
      {
        years:{
          "2026":[...],
          "2027":[...]
        }
      }

      旧形式:
      {
        y:2026,
        d:[...]
      }

      の両方に対応
    */

    if(obj.years){

      years=obj.years;

    }else if(obj.y && obj.d){

      years[String(obj.y)]=obj.d;

    }else{

      throw new Error("データ形式が不正です");

    }

    const ys=Object.keys(years)
      .sort((a,b)=>Number(b)-Number(a));

    if(!ys.length){
      throw new Error("年度データなし");
    }

    currentYear=ys[0];
    current=years[currentYear];

    setupYears();
    sortAndRender();

  }catch(e){

    console.error(e);

    document.getElementById("info").textContent=
      "URLデータを読み込めませんでした。";

  }
}

document.querySelectorAll("button[data-sort]")
.forEach(button=>{

  button.addEventListener("click",()=>{

    mode=button.dataset.sort;

    sortAndRender();

  });

});

document.getElementById("year")
.addEventListener("change",e=>{

  switchYear(e.target.value);

});

load();

</script>

</body>
</html>
